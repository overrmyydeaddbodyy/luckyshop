<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍀 LuckyShop</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080b12;
 color:#fff;
}
header{
 position:sticky;
 top:0;
 z-index:10;
 padding:15px;
 background:#111725;
 border-bottom:1px solid #293146;
}
.logo{
 font-size:28px;
 font-weight:bold;
 color:#58e88a;
}
.logo span{color:#fff}
.search{
 width:100%;
 margin-top:12px;
 padding:13px;
 border-radius:10px;
 border:1px solid #30394e;
 background:#090d15;
 color:white;
 font-size:16px;
}
.hero{
 padding:25px 15px;
 background:linear-gradient(135deg,#101827,#0b0e16);
}
.hero h1{margin:0 0 7px;font-size:30px}
.hero p{margin:0;color:#929db2}
nav{
 display:flex;
 gap:8px;
 padding:12px 15px;
 overflow-x:auto;
 background:#0d111a;
}
button{
 cursor:pointer;
 border:0;
}
.navbtn{
 white-space:nowrap;
 padding:10px 15px;
 border-radius:9px;
 background:#1b2231;
 color:#fff;
 border:1px solid #30394e;
}
.navbtn.active{
 background:#42d979;
 color:#06130a;
 border-color:#42d979;
 font-weight:bold;
}
.filters{
 padding:10px 15px;
 border-bottom:1px solid #252d3e;
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}
.filter{
 padding:8px 12px;
 border-radius:8px;
 background:#171d2a;
 color:#fff;
 border:1px solid #30394e;
}
.filter.active{
 background:#42d979;
 color:#06130a;
}
#catalog{
 padding:15px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
 gap:14px;
}
.card{
 overflow:hidden;
 background:#121824;
 border:1px solid #293247;
 border-radius:13px;
}
.cover{
 width:100%;
 height:155px;
 object-fit:cover;
 background:#202738;
 display:block;
}
.info{
 padding:11px;
}
.title{
 font-size:17px;
 font-weight:bold;
}
.creator{
 color:#8994aa;
 font-size:13px;
 margin:5px 0 9px;
}
.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}
.tag{
 padding:4px 7px;
 border-radius:6px;
 background:#222a3b;
 color:#c5ccda;
 font-size:11px;
}
.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 margin-top:10px;
}
.actions button{
 padding:9px 4px;
 border-radius:8px;
 font-weight:bold;
}
.download{
 background:#43d879;
 color:#06130a;
}
.details{
 background:#252d40;
 color:white;
}
.fav{
 width:100%;
 margin-top:7px;
 padding:8px;
 border-radius:8px;
 background:#181f2d;
 color:#ffd86b;
 border:1px solid #30394e;
}
.empty{
 grid-column:1/-1;
 text-align:center;
 padding:60px 20px;
 color:#8994a9;
}
.modalbg{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.8);
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal{
 width:100%;
 max-width:520px;
 max-height:90vh;
 overflow:auto;
 padding:20px;
 border-radius:15px;
 background:#121824;
 border:1px solid #374158;
}
.modal img{
 width:100%;
 max-height:230px;
 object-fit:cover;
 border-radius:10px;
 margin-bottom:12px;
}
.modal h2{margin:5px 0}
.modal p{
 color:#aeb7c8;
 line-height:1.5;
}
.modal button{
 width:100%;
 padding:12px;
 margin-top:8px;
 border-radius:9px;
 font-weight:bold;
}
.green{
 background:#43d879;
 color:#06130a;
}
.dark{
 background:#252d40;
 color:white;
}
.qrbox{
 margin-top:12px;
 padding:15px;
 background:white;
 color:#111;
 border-radius:10px;
 text-align:center;
}
.qrbox img{
 width:220px;
 height:220px;
 object-fit:contain;
}
footer{
 text-align:center;
 padding:30px;
 color:#626d82;
 font-size:12px;
}
@media(max-width:500px){
 #catalog{
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  padding:10px;
 }
 .cover{height:125px}
 .title{font-size:14px}
 .creator{font-size:11px}
}
</style>
</head>

<body>

<header>
 <div class="logo">🍀 Lucky<span>Shop</span></div>
 <input
  id="search"
  class="search"
  placeholder="Search LuckyShop..."
  oninput="render()"
 >
</header>

<section class="hero">
 <h1>LuckyShop 🍀</h1>
 <p>Real 3DS & DS homebrew from their official project releases.</p>
</section>

<nav>
 <button class="navbtn active" onclick="platformFilter('All',this)">Everything</button>
 <button class="navbtn" onclick="platformFilter('3DS',this)">🎮 3DS</button>
 <button class="navbtn" onclick="platformFilter('DS',this)">🎮 DS</button>
 <button class="navbtn" onclick="platformFilter('Games',this)">🕹 Games</button>
 <button class="navbtn" onclick="platformFilter('Apps',this)">🛠 Apps</button>
 <button class="navbtn" onclick="platformFilter('Favorites',this)">⭐ Favorites</button>
</nav>

<section class="filters">

 <button class="filter active" onclick="setRegion('All',this)">🌎 All</button>
 <button class="filter" onclick="setRegion('USA',this)">🇺🇸 USA</button>
 <button class="filter" onclick="setRegion('EUR',this)">🇪🇺 Europe</button>
 <button class="filter" onclick="setRegion('JPN',this)">🇯🇵 Japan</button>

 <button class="filter active" onclick="setLang('All',this)">All Languages</button>
 <button class="filter" onclick="setLang('English',this)">English</button>
 <button class="filter" onclick="setLang('Japanese',this)">Japanese</button>
 <button class="filter" onclick="setLang('French',this)">French</button>
 <button class="filter" onclick="setLang('German',this)">German</button>
 <button class="filter" onclick="setLang('Spanish',this)">Spanish</button>
 <button class="filter" onclick="setLang('Multi',this)">Multi</button>

</section>

<main id="catalog"></main>

<footer>
 🍀 LuckyShop<br>
 Legitimate homebrew and authorized software only.
</footer>

<div id="modalbg" class="modalbg">
 <div id="modal" class="modal"></div>
</div>

<script>

/* =====================================================
   LUCKYSHOP VERIFIED CATALOG
   =====================================================

   CIA links below are direct release assets.

   FBI QR = direct CIA
   NDS = download normally and use TWiLight Menu++

   ===================================================== */

const games = [

 {
  id:"universal-updater",
  title:"Universal-Updater",
  creator:"Universal-Team",
  platform:"3DS",
  category:"Apps",
  language:["English","Multi"],
  region:["USA","EUR","JPN"],
  version:"3.4.1",
  type:"CIA",
  image:"https://raw.githubusercontent.com/Universal-Team/Universal-Updater/master/resources/icon.png",

  description:
   "A homebrew store/updater for Nintendo 3DS that makes downloading and installing homebrew simple.",

  source:
   "https://github.com/Universal-Team/Universal-Updater",

  cia:
   "https://github.com/Universal-Team/Universal-Updater/releases/download/v3.4.1/Universal-Updater.cia"
 },

 {
  id:"3deins",
  title:"3DEins",
  creator:"Universal-Team / SuperSaiyajinStackZ",
  platform:"3DS",
  category:"Games",
  language:[
   "English",
   "French",
   "German",
   "Italian",
   "Japanese",
   "Spanish",
   "Multi"
  ],
  region:["USA","EUR","JPN"],
  version:"0.2.0",
  type:"CIA",
  image:
   "https://raw.githubusercontent.com/Universal-Team/3DEins/master/resources/icon.png",

  description:
   "A homebrew card game for Nintendo 3DS. It includes multiplayer, AI, customizable cards and multiple translations.",

  source:
   "https://github.com/Universal-Team/3DEins",

  cia:
   "https://github.com/Universal-Team/3DEins/releases/download/v0.2.0/3DEins.cia"
 },

 {
  id:"pksm",
  title:"PKSM",
  creator:"FlagBrew",
  platform:"3DS",
  category:"Apps",
  language:["English","Multi"],
  region:["USA","EUR","JPN"],
  version:"10.4.0",
  type:"CIA",
  image:
   "https://raw.githubusercontent.com/FlagBrew/PKSM/master/resources/icon.png",

  description:
   "A Pokémon save manager for Nintendo 3DS.",

  source:
   "https://github.com/FlagBrew/PKSM",

  /*
    PKSM officially provides PKSM.cia in its releases.
    This is kept as an official release URL rather than
    pretending a release webpage itself is a CIA.
  */
  cia:
   "https://github.com/FlagBrew/PKSM/releases/download/10.4.0/PKSM.cia"
 },

 {
  id:"checkpoint",
  title:"Checkpoint",
  creator:"BernardoGiordano",
  platform:"3DS",
  category:"Apps",
  language:["English","Multi"],
  region:["USA","EUR","JPN"],
  version:"5.2.0",
  type:"CIA",
  image:
   "https://raw.githubusercontent.com/BernardoGiordano/Checkpoint/master/resources/icon.png",

  description:
   "A Nintendo 3DS save-management application with backup and restore features.",

  source:
   "https://github.com/BernardoGiordano/Checkpoint",

  cia:
   "https://github.com/BernardoGiordano/Checkpoint/releases/download/v5.2.0/Checkpoint.cia"
 },

 {
  id:"twilight",
  title:"TWiLight Menu++",
  creator:"DS-Homebrew",
  platform:"DS",
  category:"Apps",
  language:["Multi"],
  region:["USA","EUR","JPN"],
  version:"Latest",
  type:"NDS",
  image:
   "https://raw.githubusercontent.com/DS-Homebrew/TWiLightMenu/master/booter_fc/arm9/source/icon.png",

  description:
   "A menu replacement that lets a 3DS run DS homebrew and compatible DS software.",

  source:
   "https://github.com/DS-Homebrew/TWiLightMenu",

  nds:
   "https://github.com/DS-Homebrew/TWiLightMenu/releases/latest"
 },

 {
  id:"nds-bootstrap",
  title:"nds-bootstrap",
  creator:"DS-Homebrew",
  platform:"DS",
  category:"Apps",
  language:["English"],
  region:["USA","EUR","JPN"],
  version:"Latest",
  type:"NDS",
  image:
   "https://raw.githubusercontent.com/DS-Homebrew/nds-bootstrap/master/icon.png",

  description:
   "The bootstrap software used by TWiLight Menu++ to launch Nintendo DS software.",

  source:
   "https://github.com/DS-Homebrew/nds-bootstrap",

  nds:
   "https://github.com/DS-Homebrew/nds-bootstrap/releases/latest"
 }

];

let currentPlatform="All";
let currentRegion="All";
let currentLanguage="All";

let favorites =
 JSON.parse(localStorage.getItem("LuckyShopFavorites") || "[]");

/* =====================================================
   FILTERS
   ===================================================== */

function platformFilter(value,button){

 currentPlatform=value;

 document
  .querySelectorAll(".navbtn")
  .forEach(x=>x.classList.remove("active"));

 button.classList.add("active");

 render();
}

function setRegion(value,button){

 currentRegion=value;

 document
  .querySelectorAll(".filters .filter")
  .forEach(x=>{

   if(
    ["🌎 All","🇺🇸 USA","🇪🇺 Europe","🇯🇵 Japan"]
    .includes(x.textContent)
   ){
    x.classList.remove("active");
   }

  });

 button.classList.add("active");

 render();
}

function setLang(value,button){

 currentLanguage=value;

 document
  .querySelectorAll(".filters .filter")
  .forEach(x=>{

   if(
    [
     "All Languages",
     "English",
     "Japanese",
     "French",
     "German",
     "Spanish",
     "Multi"
    ].includes(x.textContent)
   ){
    x.classList.remove("active");
   }

  });

 button.classList.add("active");

 render();
}

/* =====================================================
   FILTER LOGIC
   ===================================================== */

function filteredGames(){

 const search =
  document
   .getElementById("search")
   .value
   .toLowerCase()
   .trim();

 return games.filter(game=>{

  if(search){

   const text=
    (
     game.title+" "+
     game.creator+" "+
     game.description
    ).toLowerCase();

   if(!text.includes(search))
    return false;
  }

  if(currentPlatform==="3DS" &&
     game.platform!=="3DS")
   return false;

  if(currentPlatform==="DS" &&
     game.platform!=="DS")
   return false;

  if(currentPlatform==="Games" &&
     game.category!=="Games")
   return false;

  if(currentPlatform==="Apps" &&
     game.category!=="Apps")
   return false;

  if(currentPlatform==="Favorites" &&
     !favorites.includes(game.id))
   return false;

  if(
   currentRegion!=="All" &&
   !game.region.includes(currentRegion)
  )
   return false;

  if(
   currentLanguage!=="All" &&
   !game.language.includes(currentLanguage)
  )
   return false;

  return true;
 });
}

/* =====================================================
   RENDER
   ===================================================== */

function render(){

 const catalog=document.getElementById("catalog");

 catalog.innerHTML="";

 const list=filteredGames();

 if(!list.length){

  catalog.innerHTML=`
   <div class="empty">
    <h2>🍀 Nothing here yet</h2>
    <p>Try another category or search.</p>
   </div>
  `;

  return;
 }

 list.forEach(game=>{

  const fav=favorites.includes(game.id);

  const card=document.createElement("article");

  card.className="card";

  card.innerHTML=`

   <img
    class="cover"
    src="${game.image}"
    alt="${escapeHTML(game.title)}"
    onerror="this.style.display='none'"
   >

   <div class="info">

    <div class="title">
     ${escapeHTML(game.title)}
    </div>

    <div class="creator">
     ${escapeHTML(game.creator)}
    </div>

    <div class="tags">

     <span class="tag">
      ${game.platform}
     </span>

     <span class="tag">
      ${game.category}
     </span>

     <span class="tag">
      ${game.type}
     </span>

     <span class="tag">
      v${game.version}
     </span>

    </div>

    <div class="actions">

     <button
      class="download"
      onclick="download('${game.id}')"
     >
      ⬇ Download
     </button>

     <button
      class="details"
      onclick="details('${game.id}')"
     >
      ℹ Info
     </button>

    </div>

    <button
     class="fav"
     onclick="favorite('${game.id}')"
    >
     ${fav ? "★ Favorited" : "☆ Favorite"}
    </button>

   </div>
  `;

  catalog.appendChild(card);

 });
}

/* =====================================================
   DOWNLOAD
   ===================================================== */

function download(id){

 const game=games.find(x=>x.id===id);

 if(!game)return;

 if(game.cia){

  /*
   IMPORTANT:
   This opens the DIRECT CIA asset.
   It does not open a GitHub release page.
  */

  window.location.href=game.cia;

  return;
 }

 if(game.nds){

  window.location.href=game.nds;

  return;
 }
}

/* =====================================================
   FAVORITES
   ===================================================== */

function favorite(id){

 if(favorites.includes(id)){

  favorites=favorites.filter(x=>x!==id);

 }else{

  favorites.push(id);

 }

 localStorage.setItem(
  "LuckyShopFavorites",
  JSON.stringify(favorites)
 );

 render();
}

/* =====================================================
   DETAILS
   ===================================================== */

function details(id){

 const game=games.find(x=>x.id===id);

 if(!game)return;

 const modal=document.getElementById("modal");

 let installButton="";

 if(game.cia){

  installButton=`

   <button
    class="green"
    onclick="download('${game.id}')"
   >
    ⬇ Download CIA
   </button>

   <button
    class="green"
    onclick="showQR('${game.id}')"
   >
    📷 FBI QR — Direct CIA
   </button>

  `;

 }else{

  installButton=`

   <button
    class="green"
    onclick="download('${game.id}')"
   >
    ⬇ Download NDS
   </button>

  `;
 }

 modal.innerHTML=`

  <img
   src="${game.image}"
   onerror="this.style.display='none'"
  >

  <h2>${escapeHTML(game.title)}</h2>

  <p>
   <b>Creator:</b>
   ${escapeHTML(game.creator)}
  </p>

  <p>
   <b>Platform:</b>
   ${game.platform}
  </p>

  <p>
   <b>Version:</b>
   ${game.version}
  </p>

  <p>
   <b>Type:</b>
   ${game.type}
  </p>

  <p>
   ${escapeHTML(game.description)}
  </p>

  ${installButton}

  <button
   class="dark"
   onclick="window.open('${game.source}','_blank')"
  >
   🔗 Official Project
  </button>

  <button
   class="dark"
   onclick="closeModal()"
  >
   Close
  </button>

  <div id="qr"></div>
 `;

 document.getElementById("modalbg").style.display="flex";
}

/* =====================================================
   DIRECT CIA QR
   ===================================================== */

function showQR(id){

 const game=games.find(x=>x.id===id);

 if(!game || !game.cia)
  return;

 const qr=document.getElementById("qr");

 const qrImage=
  "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+
  encodeURIComponent(game.cia);

 qr.innerHTML=`

  <div class="qrbox">

   <strong>FBI Remote Install</strong>

   <br><br>

   <img
    src="${qrImage}"
    alt="Direct CIA QR"
   >

   <p>
    Scan this with FBI Remote Install.
    This QR contains the direct CIA URL.
   </p>

  </div>
 `;
}

/* =====================================================
   CLOSE
   ===================================================== */

function closeModal(){

 document.getElementById("modalbg").style.display="none";

}

document
 .getElementById("modalbg")
 .addEventListener("click",function(e){

  if(e.target===this)
   closeModal();

 });

/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(text){

 return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

/* =====================================================
   START
   ===================================================== */

render();

</script>

</body>
</html>
