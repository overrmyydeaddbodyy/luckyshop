<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>🍀 LuckyShop 3.0</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        linear-gradient(135deg,
        #e8fff0,
        #d9f7ff,
        #f5e5ff,
        #fff0d9);
    color: #222;
    min-height: 100vh;
}

header {
    background: linear-gradient(90deg,
        #16a34a,
        #22c55e,
        #14b8a6,
        #3b82f6);
    color: white;
    padding: 20px 12px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.2);
}

.logo {
    font-size: 38px;
    font-weight: bold;
}

.subtitle {
    margin-top: 5px;
    font-size: 14px;
    opacity: .95;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.search {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #ddd;
    font-size: 16px;
    margin-bottom: 12px;
}

.controls {
    display: grid;
    grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));
    gap: 8px;
    margin-bottom: 15px;
}

select,
button {
    padding: 12px;
    border-radius: 10px;
    border: 0;
    font-size: 14px;
    cursor: pointer;
}

select {
    background: white;
    border: 2px solid #ddd;
}

button {
    background: #16a34a;
    color: white;
    font-weight: bold;
}

button:hover {
    opacity: .9;
}

button.secondary {
    background: #64748b;
}

button.blue {
    background: #2563eb;
}

button.gold {
    background: #eab308;
    color: #111;
}

.stats {
    background: rgba(255,255,255,.8);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 15px;
    text-align: center;
    font-weight: bold;
}

.shop {
    display: grid;
    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));
    gap: 15px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
    position: relative;
    transition: transform .15s;
}

.card:hover {
    transform: translateY(-3px);
}

.cover {
    width: 100%;
    height: 150px;
    border-radius: 12px;
    background: linear-gradient(135deg,
        #bbf7d0,
        #bfdbfe);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 50px;
    margin-bottom: 12px;
}

.card h2 {
    font-size: 20px;
    margin-bottom: 6px;
}

.description {
    color: #555;
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 10px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
}

.tag {
    background: #eef2ff;
    color: #3730a3;
    padding: 5px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.new {
    background: #dc2626;
    color: white;
    padding: 5px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.updated {
    background: #2563eb;
    color: white;
    padding: 5px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.card-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.card-buttons button {
