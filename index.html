<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070d">

<title>Lucky Store</title>

<style>

/* =========================================================
   LUCKY STORE
   Persona-inspired animated interface
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #05070d;
    --panel: #0b101a;
    --panel2: #101722;
    --blue: #39a7ff;
    --cyan: #69d7ff;
    --white: #f5f9ff;
    --muted: #778399;
    --line: rgba(255,255,255,.12);
    --red: #ff416c;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;
    background:
        radial-gradient(
            circle at 75% 10%,
            rgba(57,167,255,.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(57,100,255,.10),
            transparent 35%
        ),
        var(--bg);

    color: var(--white);

    font-family:
        "Barlow Condensed",
        "Arial Narrow",
        Arial,
        sans-serif;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

.backgroundGrid {
    position: fixed;
    inset: 0;
    z-index: -3;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    transform: perspective(500px) rotateX(55deg) scale(1.7);
    transform-origin: center bottom;

    opacity: .25;
}

.backgroundGlow {
    position: fixed;
    width: 600px;
    height: 600px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(57,167,255,.12),
            transparent 70%
        );

    top: -250px;
    right: -200px;

    z-index: -2;

    pointer-events: none;
}

/* =========================================================
   APP
   ========================================================= */

.app {
    min-height: 100vh;
    position: relative;
}

/* =========================================================
   TOP HEADER
   ========================================================= */

.header {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 18px;

    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    background:
        linear-gradient(
            90deg,
            rgba(5,7,13,.96),
            rgba(8,13,23,.88)
        );

    border-bottom: 1px solid rgba(255,255,255,.08);

    backdrop-filter: blur(15px);
}

/* =========================================================
   LOGO
   ========================================================= */

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    cursor: pointer;

    user-select: none;
}

.logoIcon {
    width: 45px;
    height: 45px;

    display: grid;
    place-items: center;

    font-size: 25px;

    background:
        linear-gradient(
            135deg,
            #5bc5ff,
            #1264d8
        );

    clip-path: polygon(
        10% 0,
        100% 0,
        90% 100%,
        0 100%
    );

    transform: skew(-5deg);

    box-shadow:
        0 0 25px rgba(57,167,255,.3);

    transition: .25s;
}

.logo:hover .logoIcon {
    transform:
        skew(-5deg)
        rotate(-5deg)
        scale(1.08);
}

.logoText {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: .5px;
}

.logoText span {
    color: var(--cyan);
}

/* =========================================================
   OPTION BUTTON
   ========================================================= */

.optionButton {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 11px 17px;

    color: white;

    border: 1px solid rgba(255,255,255,.18);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    clip-path: polygon(
        7% 0,
        100% 0,
        93% 100%,
        0 100%
    );

    cursor: pointer;

    font-family: inherit;
    font-size: 17px;
    font-weight: 800;

    transition: .2s;
}

.optionButton:hover {
    background: rgba(57,167,255,.16);
}

.optionButton:active {
    transform: scale(.95);
}

.optionLines {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.optionLines i {
    width: 18px;
    height: 2px;
    background: white;
    display: block;
}

/* =========================================================
   ADDRESS BAR
   ========================================================= */

.browserBar {
    position: fixed;

    top: 70px;
    left: 0;
    right: 0;

    height: 58px;

    display: flex;
    align-items: center;

    gap: 7px;

    padding: 8px 15px;

    background:
        rgba(5,7,13,.93);

    border-bottom: 1px solid rgba(255,255,255,.07);

    z-index: 80;

    backdrop-filter: blur(15px);
}

.navButton {
    width: 39px;
    height: 39px;

    display: grid;
    place-items: center;

    border: 0;

    color: #9aa7ba;

    background: transparent;

    font-size: 20px;

    cursor: pointer;
}

.navButton:hover {
    color: white;
    background: rgba(255,255,255,.06);
}

.address {
    flex: 1;

    height: 39px;

    display: flex;
    align-items: center;

    padding: 0 12px;

    background: #0d131e;

    border: 1px solid rgba(255,255,255,.09);

    clip-path: polygon(
        1% 0,
        100% 0,
        99% 100%,
        0 100%
    );
}

.addressIcon {
    color: var(--cyan);
    margin-right: 9px;
}

.address input {
    flex: 1;

    width: 100%;

    color: white;

    background: transparent;

    border: 0;
    outline: 0;

    font-family: inherit;
    font-size: 16px;
}

.address input::placeholder {
    color: #5f6b7d;
}

.addressStar {
    cursor: pointer;
    font-size: 21px;
    color: #657185;
}

.addressStar.active {
    color: #ffd85c;
}

/* =========================================================
   MAIN
   ========================================================= */

.main {
    min-height: 100vh;

    padding-top: 128px;
}

/* =========================================================
   HOME
   ========================================================= */

.home {
    min-height: calc(100vh - 128px);

    display: flex;
    flex-direction: column;

    align-items: center;

    padding: 70px 20px 60px;

    position: relative;
}

.hero {
    text-align: center;

    animation:
        heroIn .65s cubic-bezier(.16,1,.3,1);
}

@keyframes heroIn {

    from {
        opacity: 0;
        transform:
            translateY(45px)
            skewY(4deg);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            skewY(0);
    }
}

.heroLogo {
    width: 95px;
    height: 95px;

    display: grid;
    place-items: center;

    margin: auto auto 22px;

    font-size: 50px;

    background:
        linear-gradient(
            135deg,
            #6bd8ff,
            #165fc9
        );

    clip-path: polygon(
        12% 0,
        100% 0,
        88% 100%,
        0 100%
    );

    box-shadow:
        0 20px 60px rgba(40,145,255,.22);

    animation:
        logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {

    0%,100% {
        transform: translateY(0) rotate(0);
    }

    50% {
        transform: translateY(-7px) rotate(2deg);
    }
}

.hero h1 {
    font-size: clamp(52px,10vw,90px);

    line-height: .85;

    letter-spacing: -2px;

    text-transform: uppercase;

    font-weight: 900;

    transform: skew(-5deg);
}

.hero h1 span {
    color: var(--cyan);

    text-shadow:
        4px 4px 0 rgba(57,167,255,.12);
}

.hero p {
    margin-top: 15px;

    color: var(--muted);

    font-size: 18px;

    letter-spacing: 2px;

    text-transform: uppercase;
}

/* =========================================================
   SEARCH
   ========================================================= */

.searchContainer {
    width: min(700px,100%);

    margin-top: 45px;

    animation:
        searchIn .7s .12s both
        cubic-bezier(.16,1,.3,1);
}

@keyframes searchIn {

    from {
        opacity: 0;
        transform:
            translateX(-80px)
            skewX(-8deg);
    }

    to {
        opacity: 1;
        transform:
            translateX(0)
            skewX(0);
    }
}

.search {
    height: 65px;

    display: flex;
    align-items: center;

    padding: 5px;

    background: rgba(13,19,30,.9);

    border: 1px solid rgba(255,255,255,.13);

    clip-path: polygon(
        2% 0,
        100% 0,
        98% 100%,
        0 100%
    );

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);
}

.search input {
    flex: 1;

    height: 100%;

    border: 0;
    outline: 0;

    padding: 0 18px;

    background: transparent;

    color: white;

    font-family: inherit;

    font-size: 20px;
}

.search input::placeholder {
    color: #637087;
}

.searchButton {
    width: 55px;
    height: 55px;

    border: 0;

    background:
        linear-gradient(
            135deg,
            #5bd2ff,
            #1470e4
        );

    color: white;

    font-size: 23px;

    cursor: pointer;

    clip-path: polygon(
        10% 0,
        100% 0,
        90% 100%,
        0 100%
    );

    transition: .2s;
}

.searchButton:hover {
    transform: translateX(-3px);
}

/* =========================================================
   QUICK LINKS
   ========================================================= */

.quickTitle {
    width: min(900px,100%);

    margin-top: 50px;
    margin-bottom: 14px;

    color: #748197;

    font-size: 16px;

    letter-spacing: 2px;

    text-transform: uppercase;

    animation:
        fadeUp .6s .2s both;
}

.quickLinks {
    width: min(900px,100%);

    display: grid;

    grid-template-columns:
        repeat(auto-fit,minmax(170px,1fr));

    gap: 12px;
}

.quickCard {
    min-height: 115px;

    padding: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(17,24,37,.92),
            rgba(9,14,23,.92)
        );

    border: 1px solid rgba(255,255,255,.08);

    cursor: pointer;

    clip-path: polygon(
        5% 0,
        100% 0,
        95% 100%,
        0 100%
    );

    position: relative;

    overflow: hidden;

    transition:
        transform .25s,
        border .25s;
}

.quickCard::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            100deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    transform: skewX(-20deg);

    transition: .55s;
}

.quickCard:hover::before {
    left: 120%;
}

.quickCard:hover {
    transform:
        translateX(6px)
        skewX(-1deg);

    border-color:
        rgba(91,210,255,.4);
}

.quickIcon {
    font-size: 28px;

    margin-bottom: 14px;
}

.quickCard strong {
    display: block;

    font-size: 21px;

    text-transform: uppercase;
}

.quickCard small {
    color: var(--muted);

    font-size: 14px;
}

/* =========================================================
   MENU OVERLAY
   ========================================================= */

.menuOverlay {
    position: fixed;

    inset: 0;

    z-index: 200;

    pointer-events: none;

    visibility: hidden;
}

.menuOverlay.open {
    pointer-events: auto;
    visibility: visible;
}

/* dark layer */

.menuBackdrop {
    position: absolute;

    inset: 0;

    background:
        rgba(0,0,0,.73);

    opacity: 0;

    transition: opacity .35s;
}

.menuOverlay.open .menuBackdrop {
    opacity: 1;
}

/* menu */

.menuPanel {
    position: absolute;

    top: 70px;
    right: 0;

    width: min(460px,92vw);

    min-height: calc(100vh - 70px);

    padding: 55px 30px 40px;

    background:
        linear-gradient(
            145deg,
            #111b2a,
            #070b13 75%
        );

    border-left:
        1px solid rgba(105,215,255,.22);

    transform:
        translateX(110%)
        skewX(-7deg);

    opacity: 0;

    transition:
        transform .48s cubic-bezier(.16,1,.3,1),
        opacity .25s;
}

.menuOverlay.open .menuPanel {

    transform:
        translateX(0)
        skewX(0);

    opacity: 1;
}

/* decorative stripe */

.menuPanel::before {
    content: "";

    position: absolute;

    left: -20px;
    top: 0;

    width: 10px;
    height: 100%;

    background:
        var(--cyan);

    transform: skewX(-8deg);

    box-shadow:
        0 0 25px rgba(105,215,255,.4);
}

.menuHeader {
    margin-bottom: 35px;

    transform:
        translateX(50px);

    opacity: 0;

    transition:
        .45s .15s
        cubic-bezier(.16,1,.3,1);
}

.menuOverlay.open .menuHeader {
    transform: translateX(0);
    opacity: 1;
}

.menuHeader small {
    display: block;

    color: var(--cyan);

    letter-spacing: 4px;

    font-size: 13px;

    margin-bottom: 4px;
}

.menuHeader h2 {
    font-size: 54px;

    text-transform: uppercase;

    line-height: .9;

    transform: skewX(-5deg);
}

/* menu items */

.menuItems {
    display: flex;

    flex-direction: column;

    gap: 8px;
}

.menuItem {
    width: 100%;

    min-height: 63px;

    display: flex;

    align-items: center;

    gap: 17px;

    padding: 0 18px;

    border: 0;

    color: white;

    background:
        transparent;

    cursor: pointer;

    text-align: left;

    font-family: inherit;

    position: relative;

    transform:
        translateX(100px)
        skewX(-5deg);

    opacity: 0;

    transition:
        transform .45s cubic-bezier(.16,1,.3,1),
        opacity .3s,
        background .2s;
}

.menuOverlay.open .menuItem {
    transform:
        translateX(0)
        skewX(0);

    opacity: 1;
}

.menuOverlay.open .menuItem:nth-child(1) {
    transition-delay: .20s;
}

.menuOverlay.open .menuItem:nth-child(2) {
    transition-delay: .26s;
}

.menuOverlay.open .menuItem:nth-child(3) {
    transition-delay: .32s;
}

.menuOverlay.open .menuItem:nth-child(4) {
    transition-delay: .38s;
}

.menuOverlay.open .menuItem:nth-child(5) {
    transition-delay: .44s;
}

.menuOverlay.open .menuItem:nth-child(6) {
    transition-delay: .50s;
}

.menuItem::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(57,167,255,.2),
            transparent
        );

    transform:
        translateX(-105%);

    transition: .25s;
}

.menuItem:hover::before,
.menuItem.selected::before {
    transform: translateX(0);
}

.menuItem:hover,
.menuItem.selected {
    background:
        rgba(57,167,255,.07);
}

.menuIcon {
    width: 37px;
    height: 37px;

    display: grid;
    place-items: center;

    font-size: 20px;

    background:
        rgba(255,255,255,.05);

    clip-path: polygon(
        10% 0,
        100% 0,
        90% 100%,
        0 100%
    );

    z-index: 1;
}

.menuText {
    font-size: 25px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .5px;

    z-index: 1;
}

.menuArrow {
    margin-left: auto;

    font-size: 22px;

    color: var(--cyan);

    transform: translateX(-10px);

    opacity: 0;

    transition: .2s;
}

.menuItem:hover .menuArrow,
.menuItem.selected .menuArrow {
    transform: translateX(0);
    opacity: 1;
}

/* =========================================================
   PAGE TRANSITION
   ========================================================= */

.transition {
    position: fixed;

    inset: 0;

    z-index: 500;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            135deg,
            #39a7ff 0%,
            #39a7ff 45%,
            #05070d 45.5%,
            #05070d 100%
        );

    transform:
        translateX(-110%)
        skewX(-10deg);
}

.transition.active {
    animation:
        screenWipe .65s cubic-bezier(.76,0,.24,1);
}

@keyframes screenWipe {

    0% {
        opacity: 1;
        transform:
            translateX(-110%)
            skewX(-10deg);
    }

    40% {
        opacity: 1;
        transform:
            translateX(0)
            skewX(-10deg);
    }

    60% {
        opacity: 1;
        transform:
            translateX(0)
            skewX(-10deg);
    }

    100% {
        opacity: 0;
        transform:
            translateX(110%)
            skewX(-10deg);
    }
}

/* =========================================================
   PAGE CONTAINER
   ========================================================= */

.page {
    min-height: calc(100vh - 128px);

    animation:
        pageIn .45s cubic-bezier(.16,1,.3,1);
}

@keyframes pageIn {

    from {
        opacity: 0;
        transform:
            translateX(40px)
            skewX(-2deg);
    }

    to {
        opacity: 1;
        transform:
            translateX(0)
            skewX(0);
    }
}

/* =========================================================
   SETTINGS / BOOKMARKS / HISTORY
   ========================================================= */

.contentPage {
    max-width: 1000px;

    margin: auto;

    padding: 55px 20px;
}

.pageTitle {
    font-size: 58px;

    text-transform: uppercase;

    line-height: .9;

    transform: skewX(-5deg);

    margin-bottom: 35px;
}

.pageTitle span {
    color: var(--cyan);
}

.cardList {
    display: flex;

    flex-direction: column;

    gap: 10px;
}

.listCard {
    padding: 20px;

    display: flex;

    align-items: center;

    gap: 15px;

    background:
        rgba(13,19,30,.9);

    border:
        1px solid rgba(255,255,255,.08);

    clip-path: polygon(
        1% 0,
        100% 0,
        99% 100%,
        0 100%
    );

    cursor: pointer;

    transition: .2s;
}

.listCard:hover {
    transform: translateX(8px);

    border-color:
        rgba(105,215,255,.35);
}

.listCardIcon {
    font-size: 25px;
}

.listCardInfo {
    flex: 1;
}

.listCardInfo strong {
    display: block;

    font-size: 20px;
}

.listCardInfo small {
    color: var(--muted);

    word-break: break-all;
}

.deleteButton {
    border: 0;

    background: transparent;

    color: #687489;

    font-size: 19px;

    cursor: pointer;
}

.deleteButton:hover {
    color: var(--red);
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settingBox {
    padding: 22px;

    background:
        rgba(13,19,30,.9);

    border: 1px solid rgba(255,255,255,.08);

    margin-bottom: 12px;
}

.settingBox strong {
    display: block;

    font-size: 22px;

    margin-bottom: 5px;
}

.settingBox p {
    color: var(--muted);

    font-size: 16px;
}

.clearButton {
    margin-top: 20px;

    padding: 13px 20px;

    background:
        rgba(255,65,108,.1);

    border:
        1px solid rgba(255,65,108,.35);

    color: #ff6687;

    font-family: inherit;

    font-weight: 700;

    cursor: pointer;
}

/* =========================================================
   BROWSER FRAME
   ========================================================= */

.browserPage {
    min-height: calc(100vh - 128px);
}

.browserFrame {
    width: 100%;

    height: calc(100vh - 128px);

    border: 0;

    background: white;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;

    left: 50%;

    bottom: 30px;

    z-index: 600;

    padding: 13px 22px;

    background:
        #111b2a;

    border:
        1px solid rgba(105,215,255,.35);

    color: white;

    transform:
        translate(-50%,30px)
        skewX(-4deg);

    opacity: 0;

    pointer-events: none;

    transition: .3s;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%,0)
        skewX(-4deg);
}

/* =========================================================
   FADE
   ========================================================= */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px) {

    .header {
        height: 60px;

        padding: 8px 10px;
    }

    .logoText {
        font-size: 20px;
    }

    .logoIcon {
        width: 40px;
        height: 40px;
    }

    .optionButton {
        padding: 9px 12px;
    }

    .optionText {
        display: none;
    }

    .browserBar {
        top: 60px;

        height: 57px;

        padding: 8px;
    }

    .navButton {
        width: 34px;
    }

    .main {
        padding-top: 117px;
    }

    .home {
        min-height: calc(100vh - 117px);

        padding-top: 55px;
    }

    .heroLogo {
        width: 75px;
        height: 75px;

        font-size: 40px;
    }

    .hero h1 {
        font-size: 53px;
    }

    .hero p {
        font-size: 14px;
    }

    .searchContainer {
        margin-top: 35px;
    }

    .search {
        height: 57px;
    }

    .searchButton {
        width: 47px;
        height: 47px;
    }

    .quickLinks {
        grid-template-columns:
            repeat(2,1fr);
    }

    .quickCard {
        min-height: 100px;
        padding: 14px;
    }

    .quickCard strong {
        font-size: 18px;
    }

    .quickTitle {
        margin-top: 35px;
    }

    .menuPanel {
        top: 60px;

        min-height:
            calc(100vh - 60px);

        width: 92vw;

        padding:
            45px 20px 30px;
    }

    .menuHeader h2 {
        font-size: 48px;
    }

    .menuText {
        font-size: 22px;
    }

    .pageTitle {
        font-size: 45px;
    }

    .browserFrame {
        height:
            calc(100vh - 117px);
    }
}

/* =========================================================
   REDUCE MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>

<body>

<div class="backgroundGrid"></div>
<div class="backgroundGlow"></div>

<div class="app">

    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header">

        <div
            class="logo"
            onclick="goHome()"
        >

            <div class="logoIcon">
                🍀
            </div>

            <div class="logoText">
                LUCKY <span>STORE</span>
            </div>

        </div>


        <button
            class="optionButton"
            onclick="toggleMenu()"
        >

            <div class="optionLines">
                <i></i>
                <i></i>
                <i></i>
            </div>

            <span class="optionText">
                OPTIONS
            </span>

        </button>

    </header>


    <!-- =================================================
         BROWSER BAR
         ================================================= -->

    <div class="browserBar">

        <button
            class="navButton"
            onclick="goBack()"
        >‹</button>

        <button
            class="navButton"
            onclick="goForward()"
        >›</button>

        <button
            class="navButton"
            onclick="reloadPage()"
        >↻</button>


        <div class="address">

            <span class="addressIcon">
                ●
            </span>

            <input
                id="address"
                placeholder="Search or enter a website..."
                autocomplete="off"
                onkeydown="addressKey(event)"
            >

            <span
                id="star"
                class="addressStar"
                onclick="toggleBookmark()"
            >☆</span>

        </div>

    </div>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main
        class="main"
        id="main"
    ></main>


    <!-- =================================================
         MENU
         ================================================= -->

    <div
        class="menuOverlay"
        id="menuOverlay"
    >

        <div
            class="menuBackdrop"
            onclick="toggleMenu()"
        ></div>


        <aside class="menuPanel">

            <div class="menuHeader">

                <small>
                    LUCKY STORE
                </small>

                <h2>
                    OPTIONS
                </h2>

            </div>


            <div class="menuItems">

                <button
                    class="menuItem selected"
                    onclick="menuNavigate('home',this)"
                >

                    <span class="menuIcon">
                        🍀
                    </span>

                    <span class="menuText">
                        Home
                    </span>

                    <span class="menuArrow">
                        →
                    </span>

                </button>


                <button
                    class="menuItem"
                    onclick="menuNavigate('bookmarks',this)"
                >

                    <span class="menuIcon">
                        ★
                    </span>

                    <span class="menuText">
                        Bookmarks
                    </span>

                    <span class="menuArrow">
                        →
                    </span>

                </button>


                <button
                    class="menuItem"
                    onclick="menuNavigate('history',this)"
                >

                    <span class="menuIcon">
                        ◷
                    </span>

                    <span class="menuText">
                        History
                    </span>

                    <span class="menuArrow">
                        →
                    </span>

                </button>


                <button
                    class="menuItem"
                    onclick="menuNavigate('settings',this)"
                >

                    <span class="menuIcon">
                        ⚙
                    </span>

                    <span class="menuText">
                        Settings
                    </span>

                    <span class="menuArrow">
                        →
                    </span>

                </button>


                <button
                    class="menuItem"
                    onclick="openSearch(this)"
                >

                    <span class="menuIcon">
                        🔎
                    </span>

                    <span class="menuText">
                        Search
                    </span>

                    <span class="menuArrow">
                        →
                    </span>

                </button>


                <button
                    class="menuItem"
                    onclick="aboutLucky(this)"
                >

                    <span class="menuIcon">
                        ?
                    </span>

                    <span class="menuText">
                        About
                    </span>

                    <span class="menuArrow">
                        →
                    </span>

                </button>

            </div>

        </aside>

    </div>


    <!-- =================================================
         SCREEN TRANSITION
         ================================================= -->

    <div
        class="transition"
        id="transition"
    ></div>


    <!-- =================================================
         TOAST
         ================================================= -->

    <div
        class="toast"
        id="toast"
    ></div>

</div>


<script>

/* =========================================================
   STATE
   ========================================================= */

const state = {

    currentPage: "home",

    bookmarks:
        JSON.parse(
            localStorage.getItem(
                "luckyBookmarks"
            ) || "[]"
        ),

    history:
        JSON.parse(
            localStorage.getItem(
                "luckyHistory"
            ) || "[]"
        )

};


/* =========================================================
   INIT
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        renderHome();

        document.addEventListener(
            "keydown",
            keyboardShortcuts
        );

    }
);


/* =========================================================
   HOME
   ========================================================= */

function renderHome() {

    state.currentPage = "home";

    const main =
        document.getElementById("main");

    main.innerHTML = `

        <section class="page home">

            <div class="hero">

                <div class="heroLogo">
                    🍀
                </div>

                <h1>
                    LUCKY
                    <span>STORE</span>
                </h1>

                <p>
                    Your web. Your way.
                </p>

            </div>


            <form
                class="searchContainer"
                onsubmit="homeSearch(event)"
            >

                <div class="search">

                    <input
                        id="homeSearch"
                        placeholder="SEARCH THE WEB..."
                        autocomplete="off"
                    >

                    <button
                        class="searchButton"
                        type="submit"
                    >
                        →
                    </button>

                </div>

            </form>


            <div class="quickTitle">
                Quick Access
            </div>


            <div class="quickLinks">

                ${quickCard(
                    "🔎",
                    "Google",
                    "Search",
                    "https://www.google.com"
                )}

                ${quickCard(
                    "📚",
                    "Wikipedia",
                    "Knowledge",
                    "https://www.wikipedia.org"
                )}

                ${quickCard(
                    "▶",
                    "YouTube",
                    "Videos",
                    "https://www.youtube.com"
                )}

                ${quickCard(
                    "💻",
                    "GitHub",
                    "Projects",
                    "https://github.com"
                )}

            </div>

        </section>

    `;

    setAddress("");

    updateStar();

}


/* =========================================================
   QUICK CARD
   ========================================================= */

function quickCard(
    icon,
    title,
    subtitle,
    url
) {

    return `

        <div
            class="quickCard"
            onclick="navigate('${url}')"
        >

            <div class="quickIcon">
                ${icon}
            </div>

            <strong>
                ${title}
            </strong>

            <small>
                ${subtitle}
            </small>

        </div>

    `;

}


/* =========================================================
   SEARCH
   ========================================================= */

function homeSearch(event) {

    event.preventDefault();

    const input =
        document.getElementById(
            "homeSearch"
        );

    if(!input) return;

    const value =
        input.value.trim();

    if(!value) return;

    navigate(
        createURL(value)
    );

}


function addressKey(event) {

    if(event.key !== "Enter")
        return;

    const value =
        event.target.value.trim();

    if(!value) return;

    navigate(
        createURL(value)
    );

}


function createURL(value) {

    if(
        /^https?:\/\//i.test(value)
    ) {

        return value;

    }

    if(
        /^[\w-]+\.[\w.-]+/.test(value)
    ) {

        return "https://" + value;

    }

    return (
        "https://www.google.com/search?q=" +
        encodeURIComponent(value)
    );

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function navigate(url) {

    if(!url) return;

    screenTransition(
        () => {

            state.currentPage =
                "browser";

            const main =
                document.getElementById(
                    "main"
                );

            let title = "Website";

            try {

                title =
                    new URL(url).hostname;

            }
            catch {}

            main.innerHTML = `

                <section class="page browserPage">

                    <iframe
                        class="browserFrame"
                        src="${escapeAttribute(url)}"
                        sandbox="allow-forms allow-modals allow-popups allow-scripts allow-same-origin"
                    ></iframe>

                </section>

            `;

            setAddress(url);

            addHistory(
                title,
                url
            );

            updateStar();

        }
    );

}


/* =========================================================
   HISTORY
   ========================================================= */

function addHistory(title,url) {

    state.history.unshift({

        title:title,
        url:url,
        time:Date.now()

    });

    state.history =
        state.history.slice(0,50);

    localStorage.setItem(
        "luckyHistory",
        JSON.stringify(
            state.history
        )
    );

}


/* =========================================================
   BOOKMARKS
   ========================================================= */

function toggleBookmark() {

    const url =
        document.getElementById(
            "address"
        ).value.trim();

    if(!url) {

        toast(
            "Nothing to bookmark."
        );

        return;
    }

    const index =
        state.bookmarks.findIndex(
            item =>
                item.url === url
        );

    if(index >= 0) {

        state.bookmarks.splice(
            index,
            1
        );

        toast(
            "Bookmark removed."
        );

    } else {

        let title = url;

        try {
            title =
                new URL(url).hostname;
        }
        catch {}

        state.bookmarks.push({

            title:title,
            url:url

        });

        toast(
            "Added to bookmarks."
        );

    }

    localStorage.setItem(
        "luckyBookmarks",
        JSON.stringify(
            state.bookmarks
        )
    );

    updateStar();

}


function updateStar() {

    const star =
        document.getElementById(
            "star"
        );

    if(!star) return;

    const url =
        document.getElementById(
            "address"
        ).value.trim();

    const exists =
        state.bookmarks.some(
            item =>
                item.url === url
        );

    if(exists) {

        star.textContent = "★";

        star.classList.add(
            "active"
        );

    } else {

        star.textContent = "☆";

        star.classList.remove(
            "active"
        );

    }

}


/* =========================================================
   BOOKMARK PAGE
   ========================================================= */

function renderBookmarks() {

    state.currentPage =
        "bookmarks";

    const main =
        document.getElementById(
            "main"
        );

    let cards = "";

    if(
        state.bookmarks.length === 0
    ) {

        cards = `

            <div class="listCard">

                <div class="listCardIcon">
                    ★
                </div>

                <div class="listCardInfo">

                    <strong>
                        No bookmarks yet
                    </strong>

                    <small>
                        Bookmark a website using
                        the star in the address bar.
                    </small>

                </div>

            </div>

        `;

    } else {

        cards =
            state.bookmarks.map(
                (item,index) => `

                    <div
                        class="listCard"
                        onclick="navigate('${escapeAttribute(item.url)}')"
                    >

                        <div class="listCardIcon">
                            ★
                        </div>

                        <div class="listCardInfo">

                            <strong>
                                ${escapeHTML(item.title)}
                            </strong>

                            <small>
                                ${escapeHTML(item.url)}
                            </small>

                        </div>

                        <button
                            class="deleteButton"
                            onclick="deleteBookmark(event,${index})"
                        >
                            ×
                        </button>

                    </div>

                `
            ).join("");

    }

    main.innerHTML = `

        <section class="page contentPage">

            <h1 class="pageTitle">
                BOOK<span>MARKS</span>
            </h1>

            <div class="cardList">
                ${cards}
            </div>

        </section>

    `;

    setAddress("");

}


function deleteBookmark(
    event,
    index
) {

    event.stopPropagation();

    state.bookmarks.splice(
        index,
        1
    );

    localStorage.setItem(
        "luckyBookmarks",
        JSON.stringify(
            state.bookmarks
        )
    );

    renderBookmarks();

    toast(
        "Bookmark deleted."
    );

}


/* =========================================================
   HISTORY PAGE
   ========================================================= */

function renderHistory() {

    state.currentPage =
        "history";

    const main =
        document.getElementById(
            "main"
        );

    let cards = "";

    if(
        state.history.length === 0
    ) {

        cards = `

            <div class="listCard">

                <div class="listCardIcon">
                    ◷
                </div>

                <div class="listCardInfo">

                    <strong>
                        No history yet
                    </strong>

                    <small>
                        Websites you visit will
                        appear here.
                    </small>

                </div>

            </div>

        `;

    } else {

        cards =
            state.history.map(
                (item,index) => `

                    <div
                        class="listCard"
                        onclick="navigate('${escapeAttribute(item.url)}')"
                    >

                        <div class="listCardIcon">
                            ◷
                        </div>

                        <div class="listCardInfo">

                            <strong>
                                ${escapeHTML(item.title)}
                            </strong>

                            <small>
                                ${escapeHTML(item.url)}
                            </small>

                        </div>

                    </div>

                `
            ).join("");

    }

    main.innerHTML = `

        <section class="page contentPage">

            <h1 class="pageTitle">
                HIS<span>TORY</span>
            </h1>

            <div class="cardList">
                ${cards}
            </div>

            ${
                state.history.length
                ? `
                    <button
                        class="clearButton"
                        onclick="clearHistory()"
                    >
                        CLEAR HISTORY
                    </button>
                  `
                : ""
            }

        </section>

    `;

    setAddress("");

}


function clearHistory() {

    state.history = [];

    localStorage.setItem(
        "luckyHistory",
        "[]"
    );

    renderHistory();

    toast(
        "History cleared."
    );

}


/* =========================================================
   SETTINGS
   ========================================================= */

function renderSettings() {

    state.currentPage =
        "settings";

    const main =
        document.getElementById(
            "main"
        );

    main.innerHTML = `

        <section class="page contentPage">

            <h1 class="pageTitle">
                SET<span>TINGS</span>
            </h1>


            <div class="settingBox">

                <strong>
                    🍀 Lucky Store
                </strong>

                <p>
                    A modern browser-style
                    interface with animated
                    navigation.
                </p>

            </div>


            <div class="settingBox">

                <strong>
                    Local Storage
                </strong>

                <p>
                    Bookmarks and history are
                    stored locally in your browser.
                </p>

            </div>


            <div class="settingBox">

                <strong>
                    Motion
                </strong>

                <p>
                    Lucky Store uses animated
                    transitions throughout the interface.
                </p>

            </div>


            <div class="settingBox">

                <strong>
                    Data
                </strong>

                <p>
                    Clear all locally stored Lucky
                    Store information.
                </p>

                <button
                    class="clearButton"
                    onclick="clearAllData()"
                >
                    CLEAR ALL DATA
                </button>

            </div>

        </section>

    `;

    setAddress("");

}


function clearAllData() {

    if(
        !confirm(
            "Clear Lucky Store bookmarks and history?"
        )
    ) return;

    state.bookmarks = [];
    state.history = [];

    localStorage.removeItem(
        "luckyBookmarks"
    );

    localStorage.removeItem(
        "luckyHistory"
    );

    toast(
        "All Lucky Store data cleared."
    );

}


/* =========================================================
   MENU
   ========================================================= */

function toggleMenu() {

    const menu =
        document.getElementById(
            "menuOverlay"
        );

    menu.classList.toggle(
        "open"
    );

}


function closeMenu() {

    document
        .getElementById(
            "menuOverlay"
        )
        .classList.remove(
            "open"
        );

}


function menuNavigate(
    page,
    button
) {

    document
        .querySelectorAll(
            ".menuItem"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );

    button.classList.add(
        "selected"
    );

    setTimeout(
        () => {

            closeMenu();

            screenTransition(
                () => {

                    if(page === "home")
                        renderHome();

                    if(page === "bookmarks")
                        renderBookmarks();

                    if(page === "history")
                        renderHistory();

                    if(page === "settings")
                        renderSettings();

                }
            );

        },
        180
    );

}


function openSearch(button) {

    closeMenu();

    setTimeout(
        () => {

            goHome();

            setTimeout(
                () => {

                    const input =
                        document.getElementById(
                            "homeSearch"
                        );

                    if(input)
                        input.focus();

                },
                250
            );

        },
        180
    );

}


function aboutLucky(button) {

    closeMenu();

    setTimeout(
        () => {

            toast(
                "Lucky Store 🍀 — Web interface"
            );

        },
        250
    );

}


/* =========================================================
   HOME
   ========================================================= */

function goHome() {

    screenTransition(
        () => {

            renderHome();

        }
    );

}


/* =========================================================
   SCREEN TRANSITION
   ========================================================= */

function screenTransition(
    callback
) {

    const transition =
        document.getElementById(
            "transition"
        );

    transition.classList.remove(
        "active"
    );

    void transition.offsetWidth;

    transition.classList.add(
        "active"
    );

    setTimeout(
        () => {

            callback();

        },
        310
    );

}


/* =========================================================
   BROWSER CONTROLS
   ========================================================= */

function goBack() {

    try {

        history.back();

    } catch {

        toast(
            "Back unavailable."
        );

    }

}


function goForward() {

    try {

        history.forward();

    } catch {

        toast(
            "Forward unavailable."
        );

    }

}


function reloadPage() {

    const frame =
        document.querySelector(
            ".browserFrame"
        );

    if(frame) {

        try {

            frame.contentWindow.location.reload();

        } catch {

            frame.src =
                frame.src;

        }

    } else {

        goHome();

    }

}


/* =========================================================
   ADDRESS
   ========================================================= */

function setAddress(value) {

    const address =
        document.getElementById(
            "address"
        );

    if(address)
        address.value = value;

}


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

function keyboardShortcuts(event) {

    if(
        event.key === "Escape"
    ) {

        closeMenu();

    }

    if(
        event.key === "/" &&
        !isTyping()
    ) {

        event.preventDefault();

        goHome();

        setTimeout(
            () => {

                const input =
                    document.getElementById(
                        "homeSearch"
                    );

                if(input)
                    input.focus();

            },
            300
        );

    }

}


function isTyping() {

    const active =
        document.activeElement;

    return (
        active &&
        (
            active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA"
        )
    );

}


/* =========================================================
   TOAST
   ========================================================= */

function toast(message) {

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent =
        message;

    element.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimeout
    );

    window.toastTimeout =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            2300
        );

}


/* =========================================================
   SECURITY / HTML HELPERS
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHTML(value)
        .replaceAll(
            "`",
            "&#096;"
        );

}

</script>

</body>
</html>
