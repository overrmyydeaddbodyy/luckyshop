<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>🍀 LuckyShop</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  min-height: 100vh;

  background:
    linear-gradient(
      135deg,
      #ff4ecd,
      #7657ff,
      #17d9ff,
      #24df89,
      #ffe05a
    );

  background-size: 400% 400%;
  animation: rainbow 12s ease infinite;
}

@keyframes rainbow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

header {
  text-align: center;
  padding: 18px 10px 12px;
}

.logo {
  font-size: 34px;
  font-weight: bold;
  text-shadow: 0 3px 8px rgba(0,0,0,.4);
}

.subtitle {
  font-size: 13px;
  opacity: .9;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 10px;
}

.panel {
  background: rgba(0,0,0,.42);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

.search {
  width: 100%;
  padding: 14px;
  border: 0;
  outline: none;
  border-radius: 12px;
  font-size: 16px;
}

.title {
  font-weight: bold;
  margin: 10px 0 6px;
  font-size: 13px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 9px 12px;
  background: rgba(255,255,255,.18);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.96);
}

button.active {
  background: white;
  color: black;
}

.reset {
  background: #ff506b;
}

.stats {
  text-align: center;
  font-size: 12px;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
  gap: 12px;
}

.card {
  position: relative;
  background: rgba(0,0,0,.48);
  border-radius: 16px;
  padding: 12px;
  overflow: hidden;
  box-shadow: 0 5px 18px rgba(0,0,0,.25);
}

.cover {
  width: 100%;
  height: 220px;
  border-radius: 12px;
  object-fit: cover;
  background: #222;
  display: block;
}

.cover-fallback {
  width: 100%;
  height: 220px;
  border-radius: 12px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 70px;

  background:
    linear-gradient(
      135deg,
      #1fd1f9,
      #b621fe
    );
}

.new {
  position: absolute;
  top: 20px;
  left: 20px;

  background: #ffd000;
  color: black;

  padding: 5px 8px;
  border-radius: 7px;

  font-size: 11px;
  font-weight: bold;
}

.favorite {
  position: absolute;
  right: 19px;
  top: 17px;

  font-size: 23px;
  cursor: pointer;

  text-shadow: 0 2px 5px black;
}

.name {
  margin-top: 10px;
  font-size: 18px;
  font-weight: bold;
}

.description {
  margin-top: 5px;
  font-size: 12px;
  opacity: .85;
  min-height: 38px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}

.tag {
  background: rgba(255,255,255,.15);
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 10px;
}

.info {
  margin-top: 8px;
  font-size: 11px;
  opacity: .75;
}

.card-buttons {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.card-buttons button {
  flex: 1;
  font-size: 11px;
}

.download {
  background: #22d477;
  color: black;
}

.qr {
  background: white;
  color: black;
}

.details {
  background: #6d62ff;
}

.empty {
  text-align: center;
  padding: 40px 10px;
  font-size: 15px;
}

.modal {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 100;

  background: rgba(0,0,0,.78);

  padding: 15px;

  overflow-y: auto;
}

.modal-box {
  max-width: 600px;

  margin: 35px auto;

  background: #171717;

  border-radius: 17px;

  padding: 18px;
}

.close {
  float: right;
  background: #ff526d;
}

.modal-cover {
  width: 180px;
  max-width: 100%;
  border-radius: 12px;
  display: block;
  margin: 15px auto;
}

.qr-container {
  background: white;
  padding: 15px;
  border-radius: 12px;
  width: fit-content;
  margin: 15px auto;
}

.qr-container img {
  width: 220px;
  height: 220px;
  display: block;
}

.url {
  background: #292929;
  border-radius: 8px;
  padding: 10px;
  word-break: break-all;
  font-size: 11px;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 11px;
  opacity: .8;
}

@media(max-width:500px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .cover,
  .cover-fallback {
    height: 200px;
  }

  .logo {
    font-size: 29px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    🍀 LuckyShop
  </div>

  <div class="subtitle">
    Fast 3DS / DS Homebrew Store
  </div>

</header>


<div class="container">

  <!-- SEARCH / FILTERS -->

  <div class="panel">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Search games & apps..."
      oninput="render()"
    >

    <div class="title">
      Platform
    </div>

    <div
      class="filters"
      id="platformFilters">
    </div>


    <div class="title">
      Region
    </div>

    <div
      class="filters"
      id="regionFilters">
    </div>


    <div class="title">
      Language
    </div>

    <div
      class="filters"
      id="languageFilters">
    </div>


    <div class="title">
      File Type
    </div>

    <div
      class="filters"
      id="typeFilters">
    </div>

    <br>

    <button onclick="showFavorites()">
      ⭐ Favorites
    </button>

    <button
      class="reset"
      onclick="resetFilters()">
      Reset
    </button>

  </div>


  <!-- STATS -->

  <div
    class="panel stats"
    id="stats">
  </div>


  <!-- CATALOG -->

  <div
    id="catalog"
    class="grid">
  </div>

</div>


<footer>
  🍀 LuckyShop • Homebrew & authorized files
</footer>


<!-- DETAILS -->

<div
  class="modal"
  id="detailsModal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeDetails()">
      Close
    </button>

    <h2 id="detailsName"></h2>

    <div id="detailsContent"></div>

  </div>

</div>


<!-- QR -->

<div
  class="modal"
  id="qrModal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeQR()">
      Close
    </button>

    <h2>📱 FBI QR Code</h2>

    <p>
      Scan this code with FBI.
    </p>

    <div class="qr-container">

      <img
        id="qrImage"
        alt="QR Code">

    </div>

    <div
      class="url"
      id="qrURL">
    </div>

  </div>

</div>


<script>

/*
=========================================================
LUCKYSHOP CATALOG
=========================================================

Each item has:

name
platform
region
language
type
version
size
description
cover
download
source

IMPORTANT:

"download" must be a DIRECT URL to an authorized file.

Example:

download:
"https://example.com/files/myhomebrew.nds"

Do not use a normal webpage/repository URL
as the download URL.

=========================================================
*/


const games = [

  {
    id: "twilight-menu",

    name: "TWiLight Menu++",

    platform: "DS",

    region: "Other",

    language: "Multi",

    type: "Other",

    version: "Latest",

    size: "Homebrew",

    new: true,

    icon: "🎮",

    cover: "",

    description:
      "A customizable menu for Nintendo DS and homebrew software.",

    download: "",

    source:
      "https://github.com/DS-Homebrew/TWiLightMenu"
  },


  {
    id: "nds-bootstrap",

    name: "nds-bootstrap",

    platform: "DS",

    region: "Other",

    language: "Multi",

    type: "Other",

    version: "Latest",

    size: "Homebrew",

    new: false,

    icon: "🧩",

    cover: "",

    description:
      "A component used by DS homebrew software including TWiLight Menu++.",

    download: "",

    source:
      "https://github.com/DS-Homebrew/nds-bootstrap"
  },


  {
    id: "universal-updater",

    name: "Universal-Updater",

    platform: "3DS",

    region: "Other",

    language: "Multi",

    type: "Other",

    version: "Latest",

    size: "Homebrew",

    new: true,

    icon: "⬇️",

    cover: "",

    description:
      "A homebrew application for discovering and updating software.",

    download: "",

    source:
      "https://github.com/Universal-Team/Universal-Updater"
  },


  {
    id: "godmode9",

    name: "GodMode9",

    platform: "3DS",

    region: "Other",

    language: "Multi",

    type: "Other",

    version: "Latest",

    size: "Homebrew",

    new: false,

    icon: "🛠️",

    cover: "",

    description:
      "A powerful file manager and utility for Nintendo 3DS systems.",

    download: "",

    source:
      "https://github.com/d0k3/GodMode9"
  },


  {
    id: "checkpoint",

    name: "Checkpoint",

    platform: "3DS",

    region: "Other",

    language: "Multi",

    type: "Other",

    version: "Latest",

    size: "Homebrew",

    new: false,

    icon: "💾",

    cover: "",

    description:
      "A save-management homebrew application.",

    download: "",

    source:
      "https://github.com/BernardoGiordano/Checkpoint"
  },


  /*
  =======================================================
  ADD YOUR OWN AUTHORIZED DS HOMEBREW HERE
  =======================================================

  Copy this format:

  {
    id: "my-game",

    name: "My DS Homebrew",

    platform: "DS",

    region: "USA",

    language: "English",

    type: "NDS",

    version: "1.0",

    size: "5 MB",

    new: true,

    icon: "🎮",

    cover: "YOUR-COVER-IMAGE-URL",

    description:
      "Description of the game.",

    download:
      "DIRECT-AUTHORIZED-NDS-URL",

    source:
      "PROJECT-SOURCE-URL"
  }

  =======================================================
  */

];


/* FILTER OPTIONS */

const platformOptions = [
  "All",
  "3DS",
  "DS",
  "Homebrew"
];

const regionOptions = [
  "All",
  "USA",
  "Europe",
  "Japan",
  "Australia",
  "Korea",
  "China",
  "Other"
];

const languageOptions = [
  "All",
  "English",
  "Japanese",
  "French",
  "German",
  "Spanish",
  "Italian",
  "Korean",
  "Chinese",
  "Multi"
];

const typeOptions = [
  "All",
  "NDS",
  "CIA",
  "3DS",
  "ZIP",
  "Other"
];


/* FILTER STATE */

let platform = "All";
let region = "All";
let language = "All";
let type = "All";
let favoritesOnly = false;


/* FAVORITES */

let favorites =
  JSON.parse(
    localStorage.getItem("luckyshop-favorites") || "[]"
  );


function saveFavorites() {

  localStorage.setItem(
    "luckyshop-favorites",
    JSON.stringify(favorites)
  );

}


/* FILTER BUTTON CREATOR */

function createFilterButtons(
  elementID,
  options,
  selected,
  callback
) {

  const box =
    document.getElementById(elementID);

  box.innerHTML = "";

  options.forEach(option => {

    const button =
      document.createElement("button");

    button.textContent = option;

    if (option === selected) {
      button.classList.add("active");
    }

    button.onclick = () => {

      callback(option);

      updateFilters();

      render();

    };

    box.appendChild(button);

  });

}


/* UPDATE FILTERS */

function updateFilters() {

  createFilterButtons(
    "platformFilters",
    platformOptions,
    platform,
    value => {

      platform = value;
      favoritesOnly = false;

    }
  );


  createFilterButtons(
    "regionFilters",
    regionOptions,
    region,
    value => {

      region = value;
      favoritesOnly = false;

    }
  );


  createFilterButtons(
    "languageFilters",
    languageOptions,
    language,
    value => {

      language = value;
      favoritesOnly = false;

    }
  );


  createFilterButtons(
    "typeFilters",
    typeOptions,
    type,
    value => {

      type = value;
      favoritesOnly = false;

    }
  );

}


/* GET FILTERED */

function getFilteredGames() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  return games.filter(game => {

    const matchesSearch =
      !search ||

      game.name
        .toLowerCase()
        .includes(search) ||

      game.description
        .toLowerCase()
        .includes(search);


    const matchesPlatform =
      platform === "All" ||
      game.platform === platform;


    const matchesRegion =
      region === "All" ||
      game.region === region;


    const matchesLanguage =
      language === "All" ||
      game.language === language;


    const matchesType =
      type === "All" ||
      game.type === type;


    const matchesFavorites =
      !favoritesOnly ||
      favorites.includes(game.id);


    return (
      matchesSearch &&
      matchesPlatform &&
      matchesRegion &&
      matchesLanguage &&
      matchesType &&
      matchesFavorites
    );

  });

}


/* RENDER */

function render() {

  const container =
    document.getElementById("catalog");

  const results =
    getFilteredGames();

  container.innerHTML = "";


  if (results.length === 0) {

    container.innerHTML = `
      <div class="empty">
        🍀 Nothing found.
        <br><br>
        Try another search or press Reset.
      </div>
    `;

    updateStats(0);

    return;
  }


  results.forEach(game => {

    const card =
      document.createElement("div");

    card.className = "card";


    const favorite =
      favorites.includes(game.id);


    let coverHTML;


    if (game.cover) {

      coverHTML = `
        <img
          class="cover"
          src="${escapeHTML(game.cover)}"
          alt="${escapeHTML(game.name)}"
          onerror="this.style.display='none';
          this.nextElementSibling.style.display='flex';"
        >

        <div
          class="cover-fallback"
          style="display:none">
          ${game.icon}
        </div>
      `;

    } else {

      coverHTML = `
        <div class="cover-fallback">
          ${game.icon}
        </div>
      `;

    }


    card.innerHTML = `

      ${
        game.new
        ? `<div class="new">NEW</div>`
        : ""
      }

      <div
        class="favorite"
        onclick="toggleFavorite('${game.id}')">

        ${favorite ? "⭐" : "☆"}

      </div>

      ${coverHTML}

      <div class="name">
        ${escapeHTML(game.name)}
      </div>

      <div class="description">
        ${escapeHTML(game.description)}
      </div>

      <div class="tags">

        <span class="tag">
          ${escapeHTML(game.platform)}
        </span>

        <span class="tag">
          ${escapeHTML(game.region)}
        </span>

        <span class="tag">
          ${escapeHTML(game.language)}
        </span>

        <span class="tag">
          ${escapeHTML(game.type)}
        </span>

      </div>

      <div class="info">

        Version:
        ${escapeHTML(game.version)}

        <br>

        Size:
        ${escapeHTML(game.size)}

      </div>

      <div class="card-buttons">

        <button
          class="details"
          onclick="showDetails('${game.id}')">
          Info
        </button>

        <button
          class="download"
          onclick="downloadGame('${game.id}')">
          ⬇️
        </button>

        <button
          class="qr"
          onclick="showQR('${game.id}')">
          QR
        </button>

      </div>
    `;


    container.appendChild(card);

  });


  updateStats(results.length);

}


/* STATS */

function updateStats(count) {

  document.getElementById("stats").textContent =
    `${count} shown • ${games.length} total • 🍀 LuckyShop`;

}


/* FAVORITES */

function toggleFavorite(id) {

  if (favorites.includes(id)) {

    favorites =
      favorites.filter(
        favoriteID => favoriteID !== id
      );

  } else {

    favorites.push(id);

  }

  saveFavorites();

  render();

}


/* SHOW FAVORITES */

function showFavorites() {

  favoritesOnly = true;

  platform = "All";
  region = "All";
  language = "All";
  type = "All";

  updateFilters();

  render();

}


/* RESET */

function resetFilters() {

  platform = "All";
  region = "All";
  language = "All";
  type = "All";

  favoritesOnly = false;

  document.getElementById("search").value = "";

  updateFilters();

  render();

}


/* DETAILS */

function showDetails(id) {

  const game =
    games.find(game => game.id === id);

  if (!game) return;


  document.getElementById("detailsName").textContent =
    game.icon + " " + game.name;


  let cover = "";

  if (game.cover) {

    cover = `
      <img
        class="modal-cover"
        src="${escapeHTML(game.cover)}">
    `;

  }


  document.getElementById("detailsContent").innerHTML = `

    ${cover}

    <p>
      ${escapeHTML(game.description)}
    </p>

    <hr>

    <p>
      <b>Platform:</b>
      ${escapeHTML(game.platform)}
    </p>

    <p>
      <b>Region:</b>
      ${escapeHTML(game.region)}
    </p>

    <p>
      <b>Language:</b>
      ${escapeHTML(game.language)}
    </p>

    <p>
      <b>File type:</b>
      ${escapeHTML(game.type)}
    </p>

    <p>
      <b>Version:</b>
      ${escapeHTML(game.version)}
    </p>

    <p>
      <b>Size:</b>
      ${escapeHTML(game.size)}
    </p>

    <br>

    <button
      onclick="openSource('${game.id}')">
      🔗 Project Source
    </button>

  `;


  document.getElementById("detailsModal").style.display =
    "block";

}


function closeDetails() {

  document.getElementById("detailsModal").style.display =
    "none";

}


/* SOURCE */

function openSource(id) {

  const game =
    games.find(game => game.id === id);

  if (!game || !game.source) {

    alert("No source link available.");

    return;

  }

  window.open(
    game.source,
    "_blank"
  );

}


/* DOWNLOAD */

function downloadGame(id) {

  const game =
    games.find(game => game.id === id);

  if (!game || !game.download) {

    alert(
      "This item does not have a direct authorized download yet."
    );

    return;

  }

  window.open(
    game.download,
    "_blank"
  );

}


/* QR */

function showQR(id) {

  const game =
    games.find(game => game.id === id);

  if (!game || !game.download) {

    alert(
      "No direct authorized file URL is configured for this item yet."
    );

    return;

  }


  const encoded =
    encodeURIComponent(game.download);


  const qr =
    "https://api.qrserver.com/v1/create-qr-code/?" +
    "size=300x300&data=" +
    encoded;


  document.getElementById("qrImage").src =
    qr;


  document.getElementById("qrURL").textContent =
    game.download;


  document.getElementById("qrModal").style.display =
    "block";

}


function closeQR() {

  document.getElementById("qrModal").style.display =
    "none";

}


/* ESCAPE HTML */

function escapeHTML(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* START */

updateFilters();

render();

</script>

</body>
</html>
