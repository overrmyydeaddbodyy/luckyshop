<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LuckyShop 🍀</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#090b12;
  color:white;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#15192a,#101321);
  border-bottom:1px solid #292e40;
  padding:15px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:27px;
  font-weight:bold;
  color:#7dff9b;
}

.logo span{
  color:white;
}

.search{
  margin-top:12px;
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #343a50;
  background:#0d1019;
  color:white;
  font-size:16px;
}

.hero{
  padding:25px 15px;
  background:
    radial-gradient(circle at top right,#234c36,transparent 45%),
    linear-gradient(135deg,#111728,#0a0c13);
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.hero p{
  color:#aeb5c8;
}

.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 15px;
  background:#0d1018;
}

.nav button,
.filter button{
  white-space:nowrap;
  padding:10px 14px;
  border-radius:9px;
  border:1px solid #343a50;
  background:#151925;
  color:white;
  cursor:pointer;
}

.nav button.active,
.filter button.active{
  background:#36b968;
  border-color:#36b968;
  color:#07130b;
  font-weight:bold;
}

.filters{
  padding:12px 15px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  border-bottom:1px solid #252a39;
}

.filter-title{
  width:100%;
  color:#8992a8;
  font-size:13px;
  margin-top:5px;
}

.catalog{
  padding:15px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
}

.card{
  background:#121621;
  border:1px solid #282e40;
  border-radius:13px;
  overflow:hidden;
  transition:.15s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#4ade80;
}

.cover{
  width:100%;
  height:155px;
  object-fit:cover;
  background:#202533;
  display:block;
}

.card-body{
  padding:12px;
}

.title{
  font-weight:bold;
  font-size:17px;
  margin-bottom:5px;
}

.creator{
  color:#8f99af;
  font-size:13px;
  margin-bottom:9px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:10px;
}

.tag{
  font-size:11px;
  padding:4px 7px;
  border-radius:6px;
  background:#22283a;
  color:#c8cedc;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.actions button{
  padding:9px 5px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.download{
  background:#43d477;
  color:#06150b;
}

.info{
  background:#252b3d;
  color:white;
}

.favorite{
  margin-top:7px;
  width:100%;
  background:#191e2b;
  color:#ffd86b;
  border:1px solid #343a50;
  padding:8px;
  border-radius:8px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:#8d96a9;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}

.modal{
  background:#121722;
  border:1px solid #343b50;
  border-radius:15px;
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  padding:20px;
}

.modal img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:15px;
}

.modal h2{
  margin-bottom:7px;
}

.modal p{
  color:#aeb6c8;
  line-height:1.5;
  margin:10px 0;
}

.modal button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:0;
  border-radius:9px;
  font-weight:bold;
}

.close{
  background:#282e40;
  color:white;
}

.qr{
  background:white;
  padding:15px;
  text-align:center;
  border-radius:10px;
  margin-top:12px;
}

.qr img{
  width:200px;
  height:200px;
  object-fit:contain;
}

footer{
  text-align:center;
  color:#697286;
  padding:30px 15px;
  font-size:12px;
}

@media(max-width:500px){
  .catalog{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
  }

  .cover{
    height:125px;
  }

  .card-body{
    padding:9px;
  }

  .title{
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🍀 Lucky<span>Shop</span></div>
  <input
    id="search"
    class="search"
    placeholder="Search homebrew..."
    oninput="render()"
  >
</header>

<section class="hero">
  <h1>Welcome to LuckyShop 🍀</h1>
  <p>3DS & DS homebrew, apps and games.</p>
</section>

<nav class="nav">
  <button class="active" onclick="setPlatform('All',this)">Everything</button>
  <button onclick="setPlatform('3DS',this)">🎮 3DS</button>
  <button onclick="setPlatform('DS',this)">🎮 DS</button>
  <button onclick="setPlatform('Apps',this)">🛠 Apps</button>
  <button onclick="setPlatform('Games',this)">🕹 Games</button>
  <button onclick="setPlatform('Favorites',this)">⭐ Favorites</button>
</nav>

<section class="filters">

  <div class="filter-title">REGION</div>

  <button class="active" onclick="setRegion('All',this)">All</button>
  <button onclick="setRegion('USA',this)">🇺🇸 USA</button>
  <button onclick="setRegion('EUR',this)">🇪🇺 Europe</button>
  <button onclick="setRegion('JPN',this)">🇯🇵 Japan</button>
  <button onclick="setRegion('Other',this)">Other</button>

  <div class="filter-title">LANGUAGE</div>

  <button class="active" onclick="setLanguage('All',this)">All</button>
  <button onclick="setLanguage('English',this)">English</button>
  <button onclick="setLanguage('Japanese',this)">Japanese</button>
  <button onclick="setLanguage('French',this)">French</button>
  <button onclick="setLanguage('German',this)">German</button>
  <button onclick="setLanguage('Spanish',this)">Spanish</button>
  <button onclick="setLanguage('Multi',this)">Multi</button>

</section>

<main id="catalog" class="catalog"></main>

<footer>
  🍀 LuckyShop<br>
  Homebrew and authorized software only.
</footer>

<div id="modalBg" class="modal-bg">
  <div id="modal" class="modal"></div>
</div>

<script>

/*
========================================================
LUCKYSHOP CATALOG
========================================================

IMPORTANT:

These are legitimate homebrew projects.

"download" should point directly to a file whenever
the project provides a direct public release file.

CIA = FBI can install it.

NDS = download it and use TWiLight Menu++.

3DSX = Homebrew Launcher format.

========================================================
*/

const games = [

{
 id:"checkpoint",
 title:"Checkpoint",
 creator:"Bernardo Giordano / Universal-Team",
 platform:"3DS",
 category:"Apps",
 language:["English"],
 region:["Other"],
 version:"5.2.0",
 type:"CIA / 3DSX",
 image:"https://db.universal-team.net/assets/images/checkpoint.png",
 description:"Fast and simple homebrew save-management application for Nintendo 3DS.",
 source:"https://db.universal-team.net/3ds/checkpoint",
 download:"https://github.com/BernardoGiordano/Checkpoint/releases/latest"
},

{
 id:"pksm",
 title:"PKSM",
 creator:"FlagBrew",
 platform:"3DS",
 category:"Apps",
 language:["English"],
 region:["Other"],
 version:"10.4.0",
 type:"CIA / 3DSX",
 image:"https://db.universal-team.net/assets/images/pksm.png",
 description:"Save manager for Pokémon games spanning multiple generations.",
 source:"https://db.universal-team.net/3ds/pksm",
 download:"https://github.com/FlagBrew/PKSM/releases/latest"
},

{
 id:"nimbus",
 title:"Nimbus",
 creator:"Universal-Team",
 platform:"3DS",
 category:"Apps",
 language:["English"],
 region:["Other"],
 version:"2.1.1",
 type:"CIA / 3DSX",
 image:"https://db.universal-team.net/assets/images/nimbus.png",
 description:"Homebrew application for switching between Nintendo Network and Pretendo Network.",
 source:"https://db.universal-team.net/3ds/nimbus",
 download:"https://github.com/PretendoNetwork/nimbus/releases/latest"
},

{
 id:"universal-updater",
 title:"Universal-Updater",
 creator:"Universal-Team",
 platform:"3DS",
 category:"Apps",
 language:["English"],
 region:["Other"],
 version:"3.4.1",
 type:"CIA / 3DSX",
 image:"https://db.universal-team.net/assets/images/universal-updater.png",
 description:"A 3DS homebrew application designed to download and update homebrew software.",
 source:"https://github.com/Universal-Team/Universal-Updater",
 download:"https://github.com/Universal-Team/Universal-Updater/releases/latest"
},

{
 id:"twilight",
 title:"TWiLight Menu++",
 creator:"DS-Homebrew",
 platform:"DS",
 category:"Apps",
 language:["Multi"],
 region:["Other"],
 version:"Latest",
 type:"NDS",
 image:"https://db.universal-team.net/assets/images/twilightmenu.png",
 description:"A menu replacement for Nintendo DS, DSi and 3DS that can launch DS homebrew and games.",
 source:"https://github.com/DS-Homebrew/TWiLightMenu",
 download:"https://github.com/DS-Homebrew/TWiLightMenu/releases/latest"
},

{
 id:"nds-bootstrap",
 title:"nds-bootstrap",
 creator:"DS-Homebrew",
 platform:"DS",
 category:"Apps",
 language:["English"],
 region:["Other"],
 version:"Latest",
 type:"NDS",
 image:"https://db.universal-team.net/assets/images/nds-bootstrap.png",
 description:"A project used by TWiLight Menu++ to load Nintendo DS software.",
 source:"https://github.com/DS-Homebrew/nds-bootstrap",
 download:"https://github.com/DS-Homebrew/nds-bootstrap/releases/latest"
},

{
 id:"3deins",
 title:"3DEins",
 creator:"Universal-Team",
 platform:"3DS",
 category:"Games",
 language:["Multi"],
 region:["Other"],
 version:"0.2.0",
 type:"CIA / 3DSX",
 image:"https://db.universal-team.net/assets/images/3deins.png",
 description:"A card game made for Nintendo 3DS and DS(i).",
 source:"https://db.universal-team.net/3ds/3deins",
 download:"https://github.com/Universal-Team/3DEins/releases/latest"
},

{
 id:"github3ds",
 title:"GitHub3DS",
 creator:"Morris / Artendo",
 platform:"3DS",
 category:"Apps",
 language:["English"],
 region:["Other"],
 version:"1.0.2",
 type:"CIA",
 image:"https://db.universal-team.net/assets/images/github3ds.png",
 description:"Browse GitHub repositories and download files directly from your 3DS.",
 source:"https://db.universal-team.net/3ds/github3ds",
 download:"https://github.com/MorrisTheDeveloper/GitHub3DS/releases/latest"
},

{
 id:"cia-installer",
 title:"CIA Installer",
 creator:"Zachary-Rude",
 platform:"3DS",
 category:"Apps",
 language:["English"],
 region:["Other"],
 version:"1.1.0",
 type:"CIA / 3DSX",
 image:"https://db.universal-team.net/assets/images/cia-installer.png",
 description:"A simple homebrew application for installing CIA files.",
 source:"https://db.universal-team.net/3ds/cia-installer",
 download:"https://github.com/Zachary-Rude/CIA-Installer/releases/latest"
},

{
 id:"level256",
 title:"Level256 Installer",
 creator:"Tekito_256",
 platform:"3DS",
 category:"Games",
 language:["English"],
 region:["Other"],
 version:"1.0.0",
 type:"CIA",
 image:"https://db.universal-team.net/assets/images/level256-installer.png",
 description:"A homebrew game/application available for Nintendo 3DS.",
 source:"https://db.universal-team.net/3ds/level256-installer",
 download:"https://db.universal-team.net/3ds/level256-installer"
}

];

/*
========================================================
STATE
========================================================
*/

let platform="All";
let region="All";
let language="All";

let favorites=
  JSON.parse(localStorage.getItem("luckyshopFavorites")||"[]");

/*
========================================================
FILTERS
========================================================
*/

function setPlatform(value,button){

  platform=value;

  document
    .querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  render();
}

function setRegion(value,button){

  region=value;

  const parent=button.parentElement;

  let buttons=parent.querySelectorAll("button");

  buttons.forEach(b=>{

    if(
      b.textContent==="All" ||
      b.textContent==="🇺🇸 USA" ||
      b.textContent==="🇪🇺 Europe" ||
      b.textContent==="🇯🇵 Japan" ||
      b.textContent==="Other"
    ){
      b.classList.remove("active");
    }

  });

  button.classList.add("active");

  render();
}

function setLanguage(value,button){

  language=value;

  const buttons=document.querySelectorAll(".filters button");

  buttons.forEach(b=>{

    if([
      "All",
      "English",
      "Japanese",
      "French",
      "German",
      "Spanish",
      "Multi"
    ].includes(b.textContent)){

      b.classList.remove("active");

    }

  });

  button.classList.add("active");

  render();
}

/*
========================================================
SEARCH / FILTER
========================================================
*/

function getFiltered(){

  const search=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  return games.filter(game=>{

    if(
      search &&
      !(
        game.title.toLowerCase().includes(search) ||
        game.creator.toLowerCase().includes(search) ||
        game.description.toLowerCase().includes(search)
      )
    ){
      return false;
    }

    if(platform==="3DS" && game.platform!=="3DS")
      return false;

    if(platform==="DS" && game.platform!=="DS")
      return false;

    if(platform==="Apps" && game.category!=="Apps")
      return false;

    if(platform==="Games" && game.category!=="Games")
      return false;

    if(
      platform==="Favorites" &&
      !favorites.includes(game.id)
    ){
      return false;
    }

    if(
      region!=="All" &&
      region!=="Other" &&
      !game.region.includes(region)
    ){
      return false;
    }

    if(
      language!=="All" &&
      !game.language.includes(language)
    ){
      return false;
    }

    return true;

  });

}

/*
========================================================
RENDER
========================================================
*/

function render(){

  const catalog=document.getElementById("catalog");

  const filtered=getFiltered();

  catalog.innerHTML="";

  if(filtered.length===0){

    catalog.innerHTML=`
      <div class="empty">
        <h2>🍀 Nothing found</h2>
        <p>Try another category or search.</p>
      </div>
    `;

    return;
  }

  filtered.forEach(game=>{

    const favorite=favorites.includes(game.id);

    const card=document.createElement("article");

    card.className="card";

    card.innerHTML=`

      <img
        class="cover"
        src="${game.image}"
        alt="${escapeHtml(game.title)}"
        onerror="this.style.display='none'"
      >

      <div class="card-body">

        <div class="title">
          ${escapeHtml(game.title)}
        </div>

        <div class="creator">
          ${escapeHtml(game.creator)}
        </div>

        <div class="tags">

          <span class="tag">
            ${game.platform}
          </span>

          <span class="tag">
            ${game.category}
          </span>

          <span class="tag">
            ${game.type}
          </span>

        </div>

        <div class="actions">

          <button
            class="download"
            onclick="downloadGame('${game.id}')"
          >
            ⬇ Download
          </button>

          <button
            class="info"
            onclick="showDetails('${game.id}')"
          >
            ℹ Info
          </button>

        </div>

        <button
          class="favorite"
          onclick="toggleFavorite('${game.id}')"
        >
          ${favorite ? "★ Favorited" : "☆ Favorite"}
        </button>

      </div>
    `;

    catalog.appendChild(card);

  });

}

/*
========================================================
DOWNLOAD
========================================================
*/

function downloadGame(id){

  const game=games.find(g=>g.id===id);

  if(!game) return;

  /*
    For safety and compatibility, release pages are used
    here rather than pretending every release page is a
    direct CIA file.

    A direct CIA URL can be placed into "download" when
    the project officially provides one.
  */

  window.open(game.download,"_blank");

}

/*
========================================================
FAVORITES
========================================================
*/

function toggleFavorite(id){

  if(favorites.includes(id)){

    favorites=favorites.filter(x=>x!==id);

  }else{

    favorites.push(id);

  }

  localStorage.setItem(
    "luckyshopFavorites",
    JSON.stringify(favorites)
  );

  render();

}

/*
========================================================
DETAILS
========================================================
*/

function showDetails(id){

  const game=games.find(g=>g.id===id);

  if(!game) return;

  const modal=document.getElementById("modal");

  modal.innerHTML=`

    <img
      src="${game.image}"
      onerror="this.style.display='none'"
    >

    <h2>${escapeHtml(game.title)}</h2>

    <p>
      <b>Creator:</b>
      ${escapeHtml(game.creator)}
    </p>

    <p>
      <b>Platform:</b>
      ${game.platform}
    </p>

    <p>
      <b>Category:</b>
      ${game.category}
    </p>

    <p>
      <b>Version:</b>
      ${game.version}
    </p>

    <p>
      <b>Type:</b>
      ${game.type}
    </p>

    <p>
      ${escapeHtml(game.description)}
    </p>

    <button
      style="background:#43d477;color:#06150b"
      onclick="downloadGame('${game.id}')"
    >
      ⬇ Open Official Download
    </button>

    <button
      style="background:#252b3d;color:white"
      onclick="openSource('${game.id}')"
    >
      🔗 Project Source
    </button>

    <button
      style="background:#252b3d;color:white"
      onclick="showQR('${game.id}')"
    >
      📷 QR Code
    </button>

    <button
      class="close"
      onclick="closeModal()"
    >
      Close
    </button>

    <div id="qrArea"></div>

  `;

  document.getElementById("modalBg").style.display="flex";

}

/*
========================================================
SOURCE
========================================================
*/

function openSource(id){

  const game=games.find(g=>g.id===id);

  if(!game) return;

  window.open(game.source,"_blank");

}

/*
========================================================
QR
========================================================
*/

function showQR(id){

  const game=games.find(g=>g.id===id);

  if(!game) return;

  const area=document.getElementById("qrArea");

  const qrURL=
    "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
    +encodeURIComponent(game.download);

  area.innerHTML=`

    <div class="qr">

      <p style="color:#222;margin-bottom:10px">
        Scan this QR code
      </p>

      <img src="${qrURL}" alt="QR">

      <p style="color:#555;margin-top:10px">
        This QR opens the project's download source.
      </p>

    </div>

  `;

}

/*
========================================================
MODAL
========================================================
*/

function closeModal(){

  document.getElementById("modalBg").style.display="none";

}

document
  .getElementById("modalBg")
  .addEventListener("click",function(e){

    if(e.target===this)
      closeModal();

  });

/*
========================================================
HTML ESCAPE
========================================================
*/

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/*
========================================================
START
========================================================
*/

render();

</script>

</body>
</html>
