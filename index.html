<script type="module">

/* =========================================================
   LUCKY STORE — COMPLETE JAVASCRIPT

   + Flowing Triangular Menu

/* =========================================================
   FIREBASE CONFIG
   KEEP YOUR EXISTING CONFIG HERE
========================================================= */

const firebaseConfig = {

  apiKey: "YOUR_FIREBASE_API_KEY",

  authDomain:
    "YOUR_PROJECT.firebaseapp.com",

  projectId:
    "YOUR_PROJECT_ID",

  storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const googleProvider =

/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;

let unsubscribePosts = null;

let currentProfileUID = null;


/* =========================================================
   SETTINGS
========================================================= */

const defaultSettings = {

  theme: "dark",

  accent: "blue",

  water: true,

  animations: true,

  glass: true

};


let settings = {
  ...defaultSettings
};


/* =========================================================
   LOAD LOCAL SETTINGS
========================================================= */

function loadLocalSettings() {

  try {

    const saved =
      localStorage.getItem(
        "lucky_store_settings"
      );

    if (saved) {

      settings = {
        ...defaultSettings,
        ...JSON.parse(saved)
      };

    }

  } catch (error) {

    console.warn(
      "Could not load settings",
      error
    );

  }

}


/* =========================================================
   SAVE LOCAL SETTINGS
========================================================= */

function saveLocalSettings() {

  localStorage.setItem(

    "lucky_store_settings",

    JSON.stringify(settings)

  );

}


/* =========================================================
   APPLY SETTINGS
========================================================= */

function applySettings() {

  const root =
    document.documentElement;


  /* THEME */

  root.dataset.theme =
    settings.theme;


  /* ACCENT */

  const accents = {

    blue: {
      primary: "#28bfff",
      secondary: "#176cff"
    },

    cyan: {
      primary: "#00fff0",
      secondary: "#008cff"
    },

    purple: {
      primary: "#b45cff",
      secondary: "#653cff"
    },

    pink: {
      primary: "#ff4fa3",
      secondary: "#b72fff"
    },

    green: {
      primary: "#4cff88",
      secondary: "#00a85a"
    }

  };


  const selected =
    accents[settings.accent]
    || accents.blue;


  root.style.setProperty(
    "--accent",
    selected.primary
  );

  root.style.setProperty(
    "--accent2",
    selected.secondary
  );


  /* WATER */

  if (settings.water) {

    document.body.classList.remove(
      "no-water"
    );

  } else {

    document.body.classList.add(
      "no-water"
    );

  }


  /* ANIMATIONS */

  if (settings.animations) {

    document.body.classList.remove(
      "no-animations"
    );

  } else {

    document.body.classList.add(
      "no-animations"
    );

  }


  /* GLASS */

  if (settings.glass) {

    document.body.classList.remove(
      "no-glass"
    );

  } else {

    document.body.classList.add(
      "no-glass"
    );

  }


  saveLocalSettings();

  updateSettingControls();

}


/* =========================================================
   UPDATE SETTINGS CONTROLS
========================================================= */

function updateSettingControls() {

  const themeToggle =
    document.getElementById(
      "themeToggle"
    );

  const waterToggle =
    document.getElementById(
      "waterToggle"
    );

  const animationToggle =
    document.getElementById(
      "animationToggle"
    );

  const glassToggle =
    document.getElementById(
      "glassToggle"
    );


  if (themeToggle) {

    themeToggle.classList.toggle(

      "on",

      settings.theme === "dark"

    );

  }


  if (waterToggle) {

    waterToggle.classList.toggle(

      "on",

      settings.water

    );

  }


  if (animationToggle) {

    animationToggle.classList.toggle(

      "on",

      settings.animations

    );

  }


  if (glassToggle) {

    glassToggle.classList.toggle(

      "on",

      settings.glass

    );

  }


  document
    .querySelectorAll(".accent")
    .forEach(button => {

      button.classList.toggle(

        "selected",

        button.dataset.accent ===
        settings.accent

      );

    });

}


/* =========================================================
   FIREBASE SETTINGS
========================================================= */

async function saveFirebaseSettings() {

  if (!currentUser)
    return;

  try {

    await updateDoc(

      doc(
        db,
        "profiles",
        currentUser.uid
      ),

      {

        settings: settings,

        updatedAt:
          serverTimestamp()

      }

    );

  } catch (error) {

    console.warn(
      "Could not save settings to profile:",
      error
    );

  }

}


/* =========================================================
   LOAD FIREBASE SETTINGS
========================================================= */

async function loadFirebaseSettings() {

  if (!currentUser)
    return;

  try {

    const profileSnap =
      await getDoc(

        doc(
          db,
          "profiles",
          currentUser.uid
        )

      );


    if (
      profileSnap.exists()
      &&
      profileSnap.data().settings
    ) {

      settings = {

        ...defaultSettings,

        ...profileSnap.data().settings

      };

      saveLocalSettings();

      applySettings();

    }

  } catch (error) {

    console.warn(
      "Could not load profile settings:",
      error
    );

  }

}

/* =========================================================
   OPEN MENU
========================================================= */

function openMenu() {

  createMenuIfMissing();


  const menu =
    document.getElementById(
      "luckyMenu"
    );


  menu.classList.add(
    "open"
  );


  document.body.classList.add(
    "menu-open"
  );


  updateSettingControls();

}


/* =========================================================
   CLOSE MENU
========================================================= */

function closeMenu() {

  const menu =
    document.getElementById(
      "luckyMenu"
    );


  if (!menu)
    return;


  menu.classList.remove(
    "open"
  );


  document.body.classList.remove(
    "menu-open"
  );

}


/* =========================================================
   FIND HAMBURGER
========================================================= */

function setupMenuButton() {

  const possibleButtons = [

    "#menuButton",

    "#hamburger",

    "#optionsButton",

    "#optionsBtn",

    ".menu-button",

    ".hamburger",

    ".hamburger-button",

    "[data-menu]"

  ];


  let button = null;


  for (
    const selector
    of possibleButtons
  ) {

    const found =
      document.querySelector(
        selector
      );

    if (found) {

      button = found;

      break;

    }

  }


  if (!button) {

    button =
      document.createElement(
        "button"
      );

    button.id =
      "menuButton";

    button.className =
      "menu-button";

    button.innerHTML =
      "☰";

    document.body.appendChild(
      button
    );

  }


  button.addEventListener(
    "click",
    event => {

      event.preventDefault();

      openMenu();

    }
  );

}


/* =========================================================
   MENU EVENTS
========================================================= */

function setupMenuEvents() {

  createMenuIfMissing();


  document.addEventListener(
    "click",
    event => {

      const target =
        event.target;


      /* CLOSE */

      if (
        target.id ===
        "menuClose"
      ) {

        closeMenu();

        return;

      }


      /* PAGE */

      const pageButton =
        target.closest(
          ".menu-item"
        );


      if (pageButton) {

        const page =
          pageButton.dataset.page;


        closeMenu();


        if (
          typeof showPage ===
          "function"
        ) {

          showPage(page);

        }

        return;

      }


      /* DARK MODE */

      if (
        target.id ===
        "themeToggle"
      ) {

        settings.theme =
          settings.theme ===
          "dark"
            ? "light"
            : "dark";


        applySettings();

        saveFirebaseSettings();

        return;

      }


      /* WATER */

      if (
        target.id ===
        "waterToggle"
      ) {

        settings.water =
          !settings.water;


        applySettings();

        saveFirebaseSettings();

        return;

      }


      /* ANIMATIONS */

      if (
        target.id ===
        "animationToggle"
      ) {

        settings.animations =
          !settings.animations;


        applySettings();

        saveFirebaseSettings();

        return;

      }


      /* GLASS */

      if (
        target.id ===
        "glassToggle"
      ) {

        settings.glass =
          !settings.glass;


        applySettings();

        saveFirebaseSettings();

        return;

      }


      /* ACCENT */

      const accent =
        target.closest(
          ".accent"
        );


      if (accent) {

        settings.accent =
          accent.dataset.accent;


        applySettings();

        saveFirebaseSettings();

        return;

      }

    }
  );


  /* CLICK OUTSIDE */

  document.addEventListener(
    "click",
    event => {

      const menu =
        document.getElementById(
          "luckyMenu"
        );


      if (!menu)
        return;


      if (
        !menu.classList.contains(
          "open"
        )
      )
        return;


      const panel =
        menu.querySelector(
          ".menu-panel"
        );


      if (
        !panel.contains(
          event.target
        )
      ) {

        closeMenu();

      }

    }
  );


  /* ESC */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        closeMenu();

      }

    }
  );

}


/* =========================================================
   AUTH — GOOGLE
========================================================= */

async function loginWithGoogle() {

  try {

    const isMobile =
      /Android|iPhone|iPad|iPod/i
        .test(
          navigator.userAgent
        );


    if (isMobile) {

      await signInWithRedirect(
        auth,
        googleProvider
      );

    } else {

      await signInWithPopup(
        auth,
        googleProvider
      );

    }

  } catch (error) {

    console.error(
      "Google login error:",
      error
    );

    alert(
      "Google login failed: "
      + error.message
    );

  }

}

   AUTH — EMAIL LOGIN
========================================================= */

  email,
  password
) {

    await signInWithEmailAndPassword(

      email,

      password

    );

  } catch (error) {

}

/* =========================================================
   CREATE PROFILE
========================================================= */

async function createProfile(
  user
) {

  if (!user)
    return;


  const profileRef =
    doc(
      db,
      "profiles",
      user.uid
    );


  const existing =
    await getDoc(
      profileRef
    );


  if (!existing.exists()) {

    await setDoc(

      profileRef,

      {

        uid:
          user.uid,

        displayName:
          user.displayName
          || "Lucky User",

        email:
          user.email
          || "",

        photoURL:
          user.photoURL
          || "",

        bio:
          "Welcome to Lucky Store!",

        settings:
          settings,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      }

    );

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser =
      user;


    if (user) {

      await createProfile(
        user
      );

      await loadFirebaseSettings();

    }


    updateAuthUI();

    updateProfileUI();

  }
);


/* =========================================================
   AUTH UI
========================================================= */

function updateAuthUI() {

  const accountButtons =
    document.querySelectorAll(
      "[data-account]"
    );


  accountButtons.forEach(
    button => {

      if (currentUser) {

        button.textContent =
          currentUser.displayName
          || "ACCOUNT";

      } else {

        button.textContent =
          "SIGN IN";

      }

    }
  );


  const userName =
    document.getElementById(
      "userName"
    );


  if (userName) {

    userName.textContent =
      currentUser
        ? (
            currentUser.displayName
            || "Lucky User"
          )
        : "Guest";

  }

}


/* =========================================================
   PROFILE
========================================================= */

async function getProfile(
  uid
) {

  const snap =
    await getDoc(

      doc(
        db,
        "profiles",
        uid
      )

    );


  if (!snap.exists())
    return null;


  return snap.data();

}


/* =========================================================
   UPDATE PROFILE UI
========================================================= */

async function updateProfileUI() {

  if (!currentUser)
    return;


  const profile =
    await getProfile(
      currentUser.uid
    );


  if (!profile)
    return;


  const name =
    document.getElementById(
      "profileName"
    );


  const bio =
    document.getElementById(
      "profileBio"
    );


  const avatar =
    document.getElementById(
      "profileAvatar"
    );


  if (name) {

    name.textContent =
      profile.displayName
      || "Lucky User";

  }


  if (bio) {

    bio.textContent =
      profile.bio
      || "";

  }


  if (
    avatar
    &&
    profile.photoURL
  ) {

    avatar.src =
      profile.photoURL;

  }

}


/* =========================================================
   CREATE POST
========================================================= */

async function createPost(
  text
) {

  if (!currentUser) {

    alert(
      "Please sign in first."
    );

    return;

  }


  text =
    String(text || "")
      .trim();


  if (!text)
    return;


  if (text.length > 1000) {

    alert(
      "Posts can be up to 1000 characters."
    );

    return;

  }


  const profile =
    await getProfile(
      currentUser.uid
    );


  await addDoc(

    collection(
      db,
      "posts"
    ),

    {

      authorUID:
        currentUser.uid,

      authorName:
        profile?.displayName
        || currentUser.displayName
        || "Lucky User",

      authorPhoto:
        profile?.photoURL
        || currentUser.photoURL
        || "",

      text:

        text,

      likes: [],

      createdAt:
        serverTimestamp()

    }

  );

}


/* =========================================================
   LIKE POST
========================================================= */

async function toggleLike(
  postID,
  likes
) {

  if (!currentUser) {

    alert(
      "Please sign in to like posts."
    );

    return;

  }


  const postRef =
    doc(
      db,
      "posts",
      postID
    );


  const alreadyLiked =
    Array.isArray(likes)
    &&
    likes.includes(
      currentUser.uid
    );


  try {

    if (alreadyLiked) {

      await updateDoc(

        postRef,

        {

          likes:
            arrayRemove(
              currentUser.uid
            )

        }

      );

    } else {

      await updateDoc(

        postRef,

        {

          likes:
            arrayUnion(
              currentUser.uid
            )

        }

      );

    }

  } catch (error) {

    console.error(
      "Like error:",
      error
    );

  }

}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   AVATAR
========================================================= */

function avatarURL(
  photo,
  name
) {

  if (photo)
    return photo;


  return (

    "https://ui-avatars.com/api/?name="
    +
    encodeURIComponent(
      name || "Lucky User"
    )
    +
    "&background=176cff&color=fff"

  );

}


/* =========================================================
   COMMUNITY FEED
========================================================= */

function startCommunityFeed() {

  if (unsubscribePosts) {

    unsubscribePosts();

    unsubscribePosts =
      null;

  }


  const postsRef =
    collection(
      db,
      "posts"
    );


  const postsQuery =
    query(

      postsRef,

      orderBy(
        "createdAt",
        "desc"
      ),

      limit(50)

    );


  unsubscribePosts =
    onSnapshot(

      postsQuery,

      snapshot => {

        const posts =
          [];


        snapshot.forEach(
          postSnap => {

            posts.push({

              id:
                postSnap.id,

              ...postSnap.data()

            });

          }
        );


        renderPosts(
          posts
        );

      },

      error => {

        console.error(
          "Feed error:",
          error
        );

      }

    );

}


/* =========================================================
   RENDER POSTS
========================================================= */

function renderPosts(
  posts
) {

  const container =
    document.getElementById(
      "postsContainer"
    );


  if (!container)
    return;


  container.innerHTML =
    "";


  if (!posts.length) {

    container.innerHTML = `

      <div class="empty-state">

        <h2>
          NO POSTS YET
        </h2>

        <p>
          Be the first person to post.
        </p>

      </div>

    `;

    return;

  }


  posts.forEach(
    post => {

      const likes =
        Array.isArray(
          post.likes
        )
          ? post.likes
          : [];


      const liked =
        currentUser
        &&
        likes.includes(
          currentUser.uid
        );


      const date =
        post.createdAt?.toDate
          ? post.createdAt
              .toDate()
              .toLocaleString()
          : "JUST NOW";


      const article =
        document.createElement(
          "article"
        );


      article.className =
        "post-card";


      article.innerHTML = `

        <div class="post-header">

          <img
            class="post-avatar"
            src="${avatarURL(
              post.authorPhoto,
              post.authorName
            )}"
            alt=""
          >

          <div>

            <button
              class="post-author"
              data-profile="${escapeHTML(
                post.authorUID
              )}"
            >
              ${escapeHTML(
                post.authorName
              )}
            </button>

            <div class="post-date">
              ${escapeHTML(date)}
            </div>

          </div>

        </div>


        <div class="post-text">

          ${escapeHTML(
            post.text
          )}

        </div>


        <div class="post-actions">

          <button
            class="like-button ${liked ? "liked" : ""}"
            data-like="${post.id}"
          >

            ${liked ? "♥" : "♡"}

            ${likes.length}

          </button>

        </div>

      `;


      container.appendChild(
        article
      );

    }
  );

}


/* =========================================================
   COMMUNITY EVENTS
========================================================= */

document.addEventListener(
  "click",
  event => {

    const likeButton =
      event.target.closest(
        "[data-like]"
      );


    if (likeButton) {

      const id =
        likeButton.dataset.like;


      /* Find current post
         from rendered feed */

      const postCard =
        likeButton.closest(
          ".post-card"
        );


      if (!postCard)
        return;


      /* Re-read feed document */

      getDoc(
        doc(
          db,
          "posts",
          id
        )
      )
      .then(
        snap => {

          if (!snap.exists())
            return;


          toggleLike(

            id,

            snap.data().likes
            || []

          );

        }
      );

    }


    const profileButton =
      event.target.closest(
        "[data-profile]"
      );


    if (profileButton) {

      const uid =
        profileButton.dataset.profile;


      openUserProfile(
        uid
      );

    }

  }
);


/* =========================================================
   OPEN USER PROFILE
========================================================= */

async function openUserProfile(
  uid
) {

  currentProfileUID =
    uid;


  const profile =
    await getProfile(
      uid
    );


  if (!profile) {

    alert(
      "Profile not found."
    );

    return;

  }


  if (
    typeof showPage ===
    "function"
  ) {

    showPage(
      "profile"
    );

  }


  const name =
    document.getElementById(
      "profileName"
    );


  const bio =
    document.getElementById(
      "profileBio"
    );


  const avatar =
    document.getElementById(
      "profileAvatar"
    );


  if (name) {

    name.textContent =
      profile.displayName
      || "Lucky User";

  }


  if (bio) {

    bio.textContent =
      profile.bio
      || "";

  }


  if (
    avatar
    &&
    profile.photoURL
  ) {

    avatar.src =
      profile.photoURL;

  }


  loadUserPosts(
    uid
  );

}


/* =========================================================
   LOAD USER POSTS
========================================================= */

async function loadUserPosts(
  uid
) {

  const container =
    document.getElementById(
      "profilePosts"
    );


  if (!container)
    return;


  container.innerHTML =
    "<p>Loading posts...</p>";


  try {

    const postsQuery =
      query(

        collection(
          db,
          "posts"
        ),

        orderBy(
          "createdAt",
          "desc"
        ),

        limit(100)

      );


    const snap =
      await getDoc(
        doc(
          db,
          "profiles",
          uid
        )
      );


    if (!snap.exists()) {

      container.innerHTML =
        "<p>Profile not found.</p>";

      return;

    }


    /*
      We intentionally read the feed
      and filter here so this works
      without requiring another Firestore
      composite index.
    */

    onSnapshot(

      postsQuery,

      snapshot => {

        container.innerHTML =
          "";


        let found =
          false;


        snapshot.forEach(
          postSnap => {

            const post =
              postSnap.data();


            if (
              post.authorUID !==
              uid
            )
              return;


            found =
              true;


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "post-card";


            card.innerHTML = `

              <div class="post-text">

                ${escapeHTML(
                  post.text
                )}

              </div>

            `;


            container.appendChild(
              card
            );

          }
        );


        if (!found) {

          container.innerHTML = `

            <p>
              This user hasn't posted anything yet.
            </p>

          `;

        }

      }

    );

  } catch (error) {

    console.error(
      error
    );

    container.innerHTML =
      "<p>Could not load posts.</p>";

  }

}

);

/* =========================================================

========================================================= */

document.addEventListener(
  "keydown",
  event => {

    /* ESC */

    if (
      event.key ===
      "Escape"
    ) {

      closeMenu();

    }


    /* M */

    if (
      event.key.toLowerCase()
      === "m"
      &&
      !event.ctrlKey
      &&
      !event.metaKey
    ) {

      const tag =
        document.activeElement
          ?.tagName
          ?.toLowerCase();


      if (
        tag !== "input"
        &&
        tag !== "textarea"
      ) {

        openMenu();

      }

    }

  }
);
