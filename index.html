<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>LuckyShop 🍀</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #0b0d12;
  color: white;
}

body {
  min-height: 100vh;
}

/* =========================
   HEADER
========================= */

.header {
  position: sticky;
  top: 0;
  z-index: 20;

  background: rgba(10,12,18,.96);
  border-bottom: 1px solid #252a35;

  padding: 12px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;

  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  white-space: nowrap;
}

.logo span {
  color: #62e98b;
}

.search {
  flex: 1;

  background: #171b23;
  color: white;

  border: 1px solid #2b313d;
  border-radius: 10px;

  padding: 11px 13px;
  font-size: 14px;
  outline: none;
}

.search:focus {
  border-color: #62e98b;
}

/* =========================
   APP
========================= */

.app {
  max-width: 1100px;
  margin: auto;
  padding: 14px;
}

/* =========================
   HOME HERO
========================= */

.hero {
  background:
    linear-gradient(
      135deg,
      #16251d,
      #111820
    );

  border: 1px solid #26372d;
  border-radius: 18px;

  padding: 22px;

  margin-bottom: 18px;
}

.hero-title {
  font-size: 30px;
  font-weight: 900;
  margin-bottom: 6px;
}

.hero-title span {
  color: #62e98b;
}

.hero-text {
  color: #aeb6c2;
  font-size: 13px;
  line-height: 1.5;
}

/* =========================
   NAV
========================= */

.nav {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 9px;

  margin-bottom: 20px;
}

.nav-button {
  background: #151922;
  border: 1px solid #282e39;
  color: white;

  border-radius: 12px;

  padding: 15px 8px;

  text-align: center;

  font-weight: bold;
  font-size: 12px;

  cursor: pointer;
}

.nav-button:active {
  transform: scale(.97);
}

.nav-button:hover {
  border-color: #62e98b;
}

.nav-icon {
  display: block;
  font-size: 25px;
  margin-bottom: 5px;
}

/* =========================
   SECTION
========================= */

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin: 20px 0 10px;
}

.section-title {
  font-size: 20px;
  font-weight: 900;
}

.section-count {
  color: #788291;
  font-size: 12px;
}

/* =========================
   FILTERS
========================= */

.filters {
  display: flex;
  gap: 6px;
  overflow-x: auto;

  padding-bottom: 8px;
  margin-bottom: 12px;
}

.filter {
  flex-shrink: 0;

  background: #151922;
  border: 1px solid #282e39;

  color: #b8c0cc;

  padding: 8px 11px;

  border-radius: 8px;

  font-size: 11px;
  font-weight: bold;

  cursor: pointer;
}

.filter.active {
  background: #62e98b;
  border-color: #62e98b;
  color: #08100b;
}

/* =========================
   GAME GRID
========================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fill,minmax(155px,1fr));

  gap: 12px;
}

/* =========================
   GAME CARD
========================= */

.card {
  background: #13161d;

  border: 1px solid #252b36;

  border-radius: 13px;

  overflow: hidden;

  cursor: pointer;

  transition:
    transform .15s,
    border-color .15s;
}

.card:hover {
  transform: translateY(-2px);
  border-color: #62e98b;
}

.card:active {
  transform: scale(.98);
}

.cover {
  width: 100%;
  aspect-ratio: 1 / 1.15;

  object-fit: cover;

  display: block;

  background:
    linear-gradient(
      135deg,
      #1c2730,
      #18251e
    );
}

.cover-placeholder {
  width: 100%;
  aspect-ratio: 1 / 1.15;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 52px;

  background:
    linear-gradient(
      135deg,
      #18251e,
      #18212b
    );
}

.card-body {
  padding: 10px;
}

.card-name {
  font-weight: bold;
  font-size: 13px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-type {
  color: #7f8997;
  font-size: 10px;
  margin-top: 4px;
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-top: 8px;
}

.card-region {
  color: #62e98b;
  font-size: 9px;
}

.star {
  font-size: 17px;
}

/* =========================
   DETAIL PAGE
========================= */

.page {
  display: none;
}

.page.active {
  display: block;
}

.back {
  display: inline-block;

  background: #171b23;
  border: 1px solid #2a303b;

  color: white;

  border-radius: 9px;

  padding: 9px 12px;

  margin-bottom: 15px;

  font-size: 12px;
  font-weight: bold;

  cursor: pointer;
}

.detail {
  background: #13161d;

  border: 1px solid #282e39;

  border-radius: 18px;

  overflow: hidden;
}

.detail-top {
  display: grid;
  grid-template-columns: 220px 1fr;

  gap: 22px;

  padding: 20px;
}

.detail-cover {
  width: 100%;

  border-radius: 12px;

  aspect-ratio: 1 / 1.15;

  object-fit: cover;

  background: #1a2028;
}

.detail-placeholder {
  width: 100%;

  aspect-ratio: 1 / 1.15;

  display: flex;
  justify-content: center;
  align-items: center;

  border-radius: 12px;

  font-size: 75px;

  background:
    linear-gradient(
      135deg,
      #18251e,
      #18212b
    );
}

.detail-title {
  font-size: 28px;
  font-weight: 900;

  margin: 5px 0;
}

.detail-description {
  color: #aab2bf;

  line-height: 1.6;

  font-size: 13px;

  margin: 12px 0;
}

.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;

  margin: 12px 0;
}

.tag {
  background: #202630;

  color: #b9c2cf;

  padding: 6px 8px;

  border-radius: 7px;

  font-size: 10px;
}

.detail-info {
  color: #8993a2;

  font-size: 12px;

  line-height: 1.8;
}

.actions {
  display: flex;
  gap: 8px;

  margin-top: 15px;

  flex-wrap: wrap;
}

.action {
  border: 0;

  border-radius: 9px;

  padding: 12px 15px;

  font-weight: bold;

  cursor: pointer;
}

.download {
  background: #62e98b;
  color: #07100a;
}

.qr {
  background: white;
  color: black;
}

.favorite-button {
  background: #252b35;
  color: white;
}

/* =========================
   QR
========================= */

.qr-screen {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 100;

  background: rgba(0,0,0,.9);

  padding: 20px;

  overflow-y: auto;
}

.qr-box {
  max-width: 400px;

  margin: 40px auto;

  background: #151922;

  border: 1px solid #2a303b;

  border-radius: 18px;

  padding: 20px;

  text-align: center;
}

.qr-box h2 {
  margin-top: 0;
}

.qr-image {
  width: 260px;
  height: 260px;

  max-width: 100%;

  background: white;

  padding: 10px;

  border-radius: 10px;
}

.qr-url {
  margin-top: 12px;

  background: #0d1015;

  color: #7f8997;

  padding: 10px;

  border-radius: 8px;

  font-size: 10px;

  word-break: break-all;

  text-align: left;
}

/* =========================
   EMPTY
========================= */

.empty {
  text-align: center;

  color: #7f8997;

  padding: 50px 10px;

  font-size: 13px;
}

/* =========================
   FOOTER
========================= */

footer {
  text-align: center;

  color: #56606e;

  font-size: 10px;

  padding: 30px 10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

  .header-inner {
    flex-wrap: wrap;
  }

  .logo {
    width: 100%;
  }

  .search {
    width: 100%;
  }

  .grid {
    grid-template-columns:
      repeat(2,1fr);
  }

  .detail-top {
    grid-template-columns: 1fr;
  }

  .detail-cover,
  .detail-placeholder {
    max-width: 240px;
    margin: auto;
  }

  .detail-title {
    font-size: 23px;
  }

}

@media(min-width:700px) {

  .nav {
    grid-template-columns:
      repeat(3,200px);
  }

}
</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-inner">

    <div
      class="logo"
      onclick="goHome()">

      🍀 Lucky<span>Shop</span>

    </div>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search LuckyShop..."
      oninput="searchChanged()">

  </div>

</header>


<main class="app">


<!-- =========================
     HOME PAGE
========================= -->

<section
  id="homePage"
  class="page active">


  <div class="hero">

    <div class="hero-title">

      Welcome to
      <span>LuckyShop</span> 🍀

    </div>

    <div class="hero-text">

      A lightweight homebrew catalog designed
      for Nintendo 3DS and DS systems.

      Browse apps, homebrew and authorized
      downloadable files.

    </div>

  </div>


  <!-- NAVIGATION -->

  <div class="nav">

    <div
      class="nav-button"
      onclick="setPlatform('DS')">

      <span class="nav-icon">🎮</span>

      DS GAMES

    </div>


    <div
      class="nav-button"
      onclick="setPlatform('3DS')">

      <span class="nav-icon">🎮</span>

      3DS APPS

    </div>


    <div
      class="nav-button"
      onclick="setPlatform('Homebrew')">

      <span class="nav-icon">🛠️</span>

      HOMEBREW

    </div>

  </div>


  <!-- CATALOG -->

  <div class="section-header">

    <div class="section-title">
      Browse
    </div>

    <div
      id="count"
      class="section-count">
    </div>

  </div>


  <div
    id="platformFilters"
    class="filters">
  </div>


  <div
    id="regionFilters"
    class="filters">
  </div>


  <div
    id="languageFilters"
    class="filters">
  </div>


  <div
    id="catalog"
    class="grid">
  </div>


</section>


<!-- =========================
     DETAIL PAGE
========================= -->

<section
  id="detailPage"
  class="page">

  <button
    class="back"
    onclick="goHome()">

    ← Back to LuckyShop

  </button>


  <div class="detail">

    <div class="detail-top">

      <div id="detailCover"></div>


      <div>

        <div
          id="detailTitle"
          class="detail-title">
        </div>


        <div
          id="detailDescription"
          class="detail-description">
        </div>


        <div
          id="detailTags"
          class="detail-tags">
        </div>


        <div
          id="detailInfo"
          class="detail-info">
        </div>


        <div class="actions">

          <button
            id="downloadButton"
            class="action download">

            ⬇️ Download

          </button>


          <button
            id="qrButton"
            class="action qr">

            📱 FBI QR

          </button>


          <button
            id="favoriteButton"
            class="action favorite-button">

            ☆ Favorite

          </button>

        </div>

      </div>

    </div>

  </div>

</section>


</main>


<footer>
🍀 LuckyShop
</footer>


<!-- =========================
     QR SCREEN
========================= -->

<div
  id="qrScreen"
  class="qr-screen">

  <div class="qr-box">

    <button
      class="back"
      onclick="closeQR()">

      ← Close

    </button>

    <h2>📱 FBI QR</h2>

    <p>
      Scan the QR code with FBI.
    </p>

    <img
      id="qrImage"
      class="qr-image"
      alt="QR Code">

    <div
      id="qrURL"
      class="qr-url">
    </div>

  </div>

</div>


<script>

/* =====================================================
   LUCKYSHOP DATABASE
=====================================================

IMPORTANT:

This catalog is intentionally populated with
homebrew / legitimate project entries.

For a file you are authorized to distribute,
put its DIRECT download URL in:

download: "..."

Example:

download:
"https://example.com/myhomebrew.nds"

For a CIA:

download:
"https://example.com/myhomebrew.cia"

The QR button will encode that direct URL.

===================================================== */


const catalog = [

  {
    id: "twilight-menu",

    name: "TWiLight Menu++",

    platform: "DS",

    region: "Other",

    language: "Multi",

    type: "Homebrew",

    version: "Latest",

    size: "Homebrew",

    icon: "🎮",

    cover: "",

    description:
      "A customizable menu for launching Nintendo DS software and homebrew.",

    download: "",

    source:
      "https://github.com/DS-Homebrew/TWiLightMenu"
  },


  {
    id: "nds-bootstrap",

    name: "nds-bootstrap",

    platform: "DS",

    region: "Other",

    language: "Multi",

    type: "Homebrew",

    version: "Latest",

    size: "Homebrew",

    icon: "🧩",

    cover: "",

    description:
      "A component used by Nintendo DS homebrew projects.",

    download: "",

    source:
      "https://github.com/DS-Homebrew/nds-bootstrap"
  },


  {
    id: "universal-updater",

    name: "Universal-Updater",

    platform: "3DS",

    region: "Other",

    language: "Multi",

    type: "Homebrew",

    version: "Latest",

    size: "Homebrew",

    icon: "⬇️",

    cover: "",

    description:
      "A homebrew application for discovering and updating software.",

    download: "",

    source:
      "https://github.com/Universal-Team/Universal-Updater"
  },


  {
    id: "godmode9",

    name: "GodMode9",

    platform: "3DS",

    region: "Other",

    language: "Multi",

    type: "Homebrew",

    version: "Latest",

    size: "Homebrew",

    icon: "🛠️",

    cover: "",

    description:
      "A powerful file manager and utility for Nintendo 3DS systems.",

    download: "",

    source:
      "https://github.com/d0k3/GodMode9"
  },


  {
    id: "checkpoint",

    name: "Checkpoint",

    platform: "3DS",

    region: "Other",

    language: "Multi",

    type: "Homebrew",

    version: "Latest",

    size: "Homebrew",

    icon: "💾",

    cover: "",

    description:
      "A save-management homebrew application.",

    download: "",

    source:
      "https://github.com/BernardoGiordano/Checkpoint"
  }

];


/* =====================================================
   STATE
===================================================== */

let selectedPlatform = "All";

let selectedRegion = "All";

let selectedLanguage = "All";

let currentGame = null;


/* =====================================================
   FAVORITES
===================================================== */

let favorites =
  JSON.parse(
    localStorage.getItem(
      "luckyshop-favorites"
    ) || "[]"
  );


function saveFavorites() {

  localStorage.setItem(
    "luckyshop-favorites",
    JSON.stringify(favorites)
  );

}


/* =====================================================
   FILTERS
===================================================== */

const platforms = [
  "All",
  "DS",
  "3DS",
  "Homebrew"
];

const regions = [
  "All",
  "USA",
  "Europe",
  "Japan",
  "Australia",
  "Korea",
  "China",
  "Other"
];

const languages = [
  "All",
  "English",
  "Japanese",
  "French",
  "German",
  "Spanish",
  "Italian",
  "Korean",
  "Chinese",
  "Multi"
];


function createFilters(
  elementID,
  values,
  selected,
  callback
) {

  const element =
    document.getElementById(
      elementID
    );

  element.innerHTML = "";


  values.forEach(value => {

    const button =
      document.createElement(
        "button"
      );

    button.className = "filter";

    button.textContent = value;


    if (value === selected) {

      button.classList.add(
        "active"
      );

    }


    button.onclick = () => {

      callback(value);

      renderFilters();

      renderCatalog();

    };


    element.appendChild(button);

  });

}


function renderFilters() {

  createFilters(
    "platformFilters",
    platforms,
    selectedPlatform,
    value => {
      selectedPlatform = value;
    }
  );


  createFilters(
    "regionFilters",
    regions,
    selectedRegion,
    value => {
      selectedRegion = value;
    }
  );


  createFilters(
    "languageFilters",
    languages,
    selectedLanguage,
    value => {
      selectedLanguage = value;
    }
  );

}


/* =====================================================
   SEARCH
===================================================== */

function searchChanged() {

  if (
    !document
      .getElementById("homePage")
      .classList
      .contains("active")
  ) {

    goHome();

  }

  renderCatalog();

}


/* =====================================================
   FILTER RESULTS
===================================================== */

function getResults() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  return catalog.filter(game => {

    const searchMatch =
      !search ||

      game.name
        .toLowerCase()
        .includes(search) ||

      game.description
        .toLowerCase()
        .includes(search);


    const platformMatch =
      selectedPlatform === "All" ||
      game.platform === selectedPlatform;


    const regionMatch =
      selectedRegion === "All" ||
      game.region === selectedRegion;


    const languageMatch =
      selectedLanguage === "All" ||
      game.language === selectedLanguage;


    return (
      searchMatch &&
      platformMatch &&
      regionMatch &&
      languageMatch
    );

  });

}


/* =====================================================
   CATALOG
===================================================== */

function renderCatalog() {

  const box =
    document.getElementById(
      "catalog"
    );

  const results =
    getResults();


  box.innerHTML = "";


  document.getElementById(
    "count"
  ).textContent =
    results.length +
    " item" +
    (results.length === 1 ? "" : "s");


  if (results.length === 0) {

    box.innerHTML = `
      <div class="empty">
        🍀 Nothing found.
        <br><br>
        Try another search or filter.
      </div>
    `;

    return;

  }


  results.forEach(game => {

    const card =
      document.createElement(
        "div"
      );

    card.className = "card";

    card.onclick = () =>
      openGame(game.id);


    let cover;


    if (game.cover) {

      cover = `
        <img
          class="cover"
          src="${escapeHTML(game.cover)}"
          alt="${escapeHTML(game.name)}"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          "
        >

        <div
          class="cover-placeholder"
          style="display:none">

          ${game.icon}

        </div>
      `;

    } else {

      cover = `
        <div class="cover-placeholder">
          ${game.icon}
        </div>
      `;

    }


    const favorite =
      favorites.includes(
        game.id
      );


    card.innerHTML = `

      ${cover}

      <div class="card-body">

        <div class="card-name">
          ${escapeHTML(game.name)}
        </div>

        <div class="card-type">
          ${escapeHTML(game.type)}
        </div>

        <div class="card-bottom">

          <div class="card-region">
            ${escapeHTML(game.region)}
          </div>

          <div class="star">
            ${favorite ? "⭐" : "☆"}
          </div>

        </div>

      </div>

    `;


    box.appendChild(card);

  });

}


/* =====================================================
   OPEN GAME
===================================================== */

function openGame(id) {

  const game =
    catalog.find(
      item => item.id === id
    );


  if (!game) return;


  currentGame = game;


  document
    .getElementById("homePage")
    .classList
    .remove("active");


  document
    .getElementById("detailPage")
    .classList
    .add("active");


  renderDetails();

  window.scrollTo(
    0,
    0
  );

}


/* =====================================================
   DETAILS
===================================================== */

function renderDetails() {

  const game =
    currentGame;


  document.getElementById(
    "detailTitle"
  ).textContent =
    game.icon +
    " " +
    game.name;


  document.getElementById(
    "detailDescription"
  ).textContent =
    game.description;


  document.getElementById(
    "detailTags"
  ).innerHTML = `

    <span class="tag">
      ${escapeHTML(game.platform)}
    </span>

    <span class="tag">
      ${escapeHTML(game.region)}
    </span>

    <span class="tag">
      ${escapeHTML(game.language)}
    </span>

    <span class="tag">
      ${escapeHTML(game.type)}
    </span>

  `;


  document.getElementById(
    "detailInfo"
  ).innerHTML = `

    Version:
    ${escapeHTML(game.version)}

    <br>

    Size:
    ${escapeHTML(game.size)}

  `;


  const cover =
    document.getElementById(
      "detailCover"
    );


  if (game.cover) {

    cover.innerHTML = `

      <img
        class="detail-cover"
        src="${escapeHTML(game.cover)}"
        alt="${escapeHTML(game.name)}">

    `;

  } else {

    cover.innerHTML = `

      <div class="detail-placeholder">
        ${game.icon}
      </div>

    `;

  }


  updateFavoriteButton();

}


/* =====================================================
   FAVORITE BUTTON
===================================================== */

function updateFavoriteButton() {

  const button =
    document.getElementById(
      "favoriteButton"
    );


  if (
    favorites.includes(
      currentGame.id
    )
  ) {

    button.textContent =
      "⭐ Remove Favorite";

  } else {

    button.textContent =
      "☆ Add Favorite";

  }

}


document
  .getElementById(
    "favoriteButton"
  )
  .onclick = () => {

    if (
      favorites.includes(
        currentGame.id
      )
    ) {

      favorites =
        favorites.filter(
          id =>
            id !== currentGame.id
        );

    } else {

      favorites.push(
        currentGame.id
      );

    }


    saveFavorites();

    updateFavoriteButton();

  };


/* =====================================================
   DOWNLOAD
===================================================== */

document
  .getElementById(
    "downloadButton"
  )
  .onclick = () => {

    if (
      !currentGame.download
    ) {

      alert(
        "This item does not have a direct authorized download URL yet."
      );

      return;

    }


    window.open(
      currentGame.download,
      "_blank"
    );

  };


/* =====================================================
   QR
===================================================== */

document
  .getElementById(
    "qrButton"
  )
  .onclick = () => {

    if (
      !currentGame.download
    ) {

      alert(
        "This item does not have a direct authorized file URL yet."
      );

      return;

    }


    const encoded =
      encodeURIComponent(
        currentGame.download
      );


    const qrURL =
      "https://api.qrserver.com/v1/create-qr-code/" +
      "?size=300x300&data=" +
      encoded;


    document.getElementById(
      "qrImage"
    ).src =
      qrURL;


    document.getElementById(
      "qrURL"
    ).textContent =
      currentGame.download;


    document.getElementById(
      "qrScreen"
    ).style.display =
      "block";

  };


function closeQR() {

  document.getElementById(
    "qrScreen"
  ).style.display =
    "none";

}


/* =====================================================
   PLATFORM SHORTCUTS
===================================================== */

function setPlatform(value) {

  selectedPlatform =
    value;

  renderFilters();

  renderCatalog();

  window.scrollTo(
    0,
    0
  );

}


/* =====================================================
   HOME
===================================================== */

function goHome() {

  document
    .getElementById("detailPage")
    .classList
    .remove("active");


  document
    .getElementById("homePage")
    .classList
    .add("active");


  renderFilters();

  renderCatalog();

  window.scrollTo(
    0,
    0
  );

}


/* =====================================================
   HTML ESCAPING
===================================================== */

function escapeHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

renderFilters();

renderCatalog();

</script>
