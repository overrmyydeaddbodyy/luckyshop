<!-- LuckyShop QR -->
<section style="
  text-align:center;
  padding:30px 15px;
  margin-top:30px;
  background:#101521;
  border-top:1px solid #293146;
">

  <h2 style="margin:0 0 8px;color:#58e88a;">
    🍀 Get LuckyShop
  </h2>

  <p style="color:#9aa5b8;margin-bottom:18px;">
    Scan this QR code with your 3DS to open LuckyShop.
  </p>

  <div style="
    display:inline-block;
    background:white;
    padding:14px;
    border-radius:12px;
  ">
    <img
      id="siteQR"
      width="220"
      height="220"
      alt="LuckyShop QR Code"
    >
  </div>

  <p style="
    color:#68748a;
    font-size:12px;
    margin-top:15px;
  ">
    Scan → Open LuckyShop → Browse Homebrew
  </p>

</section>

<script>
  const luckyShopURL = window.location.href;

  document.getElementById("siteQR").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
    encodeURIComponent(luckyShopURL);
</script>
