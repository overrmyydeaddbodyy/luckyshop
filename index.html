<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LuckyShop 🍀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      min-height: 100vh;
      background: linear-gradient(
        135deg,
        #ff4b4b,
        #ff9f43,
        #ffe66d,
        #4cd97b,
        #4dabf7,
        #9b59b6
      );
      background-size: 400% 400%;
      animation: rainbow 15s ease infinite;
    }

    @keyframes rainbow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: auto;
      padding: 20px 0 40px;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      text-shadow: 0 3px 10px rgba(0,0,0,0.35);
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.95;
      margin-top: 8px;
    }

    .panel {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      font-size: 15px;
    }

    input,
    select {
      background: white;
      color: #222;
    }

    button {
      background: rgba(255,255,255,0.9);
      color: #222;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: white;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .stats {
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: rgba(0,0,0,0.5);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .card h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .tag {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 5px 8px;
      border-radius: 8px;
      margin: 3px;
      font-size: 12px;
    }

    .card-buttons {
      margin-top: 12px;
    }

    .card-buttons button {
      margin-top: 5px;
    }

    .favorite {
      background: #ffd43b;
    }

    .empty {
      text-align: center;
      padding: 30px;
      font-size: 18px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      opacity: 0.9;
      font-size: 13px;
    }

    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      background: #222;
      width: 100%;
      max-width: 500px;
      border-radius: 18px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .close {
      background: #ff5c5c;
      color: white;
    }

    #qr {
      text-align: center;
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">🍀 LuckyShop</div>
    <div class="subtitle">
      Your homebrew shop for Nintendo 3DS
    </div>
  </header>

  <div class="panel">

    <input
      type="text"
      id="search"
      placeholder="🔎 Search LuckyShop..."
      oninput="showGames()"
    >

    <div class="filters">

      <select id="platform" onchange="showGames()">
        <option value="all">All Platforms</option>
        <option value="3ds">3DS</option>
        <option value="ds">DS</option>
        <option value="homebrew">Homebrew</option>
      </select>

      <select id="region" onchange="showGames()">
        <option value="all">All Regions</option>
        <option value="usa">USA</option>
        <option value="eur">Europe</option>
        <option value="jpn">Japan</option>
        <option value="aus">Australia</option>
        <option value="kor">Korea</option>
        <option value="chn">China</option>
        <option value="other">Other</option>
      </select>

      <select id="language" onchange="showGames()">
        <option value="all">All Languages</option>
        <option value="english">English</option>
        <option value="japanese">Japanese</option>
        <option value="french">French</option>
        <option value="german">German</option>
        <option value="spanish">Spanish</option>
        <option value="italian">Italian</option>
        <option value="korean">Korean</option>
        <option value="chinese">Chinese</option>
        <option value="multi">Multi-language</option>
      </select>

      <select id="type" onchange="showGames()">
        <option value="all">All File Types</option>
        <option value="cia">CIA</option>
        <option value="nds">NDS</option>
        <option value="3dsfile">3DS</option>
        <option value="zip">ZIP</option>
        <option value="other">Other</option>
      </select>

    </div>

    <div class="buttons">
      <button onclick="showAll()">📦 All</button>
      <button onclick="showFavorites()">⭐ Favorites</button>
      <button onclick="resetFilters()">🔄 Reset</button>
    </div>

  </div>

  <div class="panel">

    <div class="stats" id="stats">
      Loading LuckyShop...
    </div>

    <div class="games" id="games"></div>

  </div>

  <footer>
    🍀 LuckyShop — Homebrew & authorized files only
  </footer>

</div>


<!-- DETAILS / QR MODAL -->

<div id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">LuckyShop</h2>

    <p id="modalText"></p>

    <div id="qr"></div>

    <button class="close" onclick="closeModal()">
      ✖ Close
    </button>

  </div>

</div>


<script>

const games = [

  {
    name: "TWiLight Menu++",
    platform: "ds",
    region: "other",
    language: "multi",
    type: "other",
    version: "Latest",
    description: "A homebrew menu for playing Nintendo DS games and homebrew.",
    source: "https://github.com/DS-Homebrew/TWiLightMenu",
    download: ""
  },

  {
    name: "Universal-Updater",
    platform: "3ds",
    region: "other",
    language: "multi",
    type: "cia",
    version: "Latest",
    description: "A homebrew application for downloading and updating 3DS homebrew.",
    source: "https://github.com/Universal-Team/Universal-Updater",
    download: ""
  },

  {
    name: "nds-bootstrap",
    platform: "ds",
    region: "other",
    language: "multi",
    type: "other",
    version: "Latest",
    description: "Software used by several Nintendo DS homebrew projects.",
    source: "https://github.com/DS-Homebrew/nds-bootstrap",
    download: ""
  },

  {
    name: "GodMode9",
    platform: "3ds",
    region: "other",
    language: "english",
    type: "other",
    version: "Latest",
    description: "A powerful file manager and utility for modded Nintendo 3DS systems.",
    source: "https://github.com/d0k3/GodMode9",
    download: ""
  }

];


function getFavorites() {

  try {

    return JSON.parse(
      localStorage.getItem("luckyshopFavorites") || "[]"
    );

  } catch {

    return [];

  }

}


function saveFavorites(favorites) {

  localStorage.setItem(
    "luckyshopFavorites",
    JSON.stringify(favorites)
  );

}


function toggleFavorite(index) {

  const favorites = getFavorites();

  if (favorites.includes(index)) {

    const position = favorites.indexOf(index);

    favorites.splice(position, 1);

  } else {

    favorites.push(index);

  }

  saveFavorites(favorites);

  showGames();

}


function showGames(list = null) {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const platform =
    document.getElementById("platform").value;

  const region =
    document.getElementById("region").value;

  const language =
    document.getElementById("language").value;

  const type =
    document.getElementById("type").value;


  let results = list || games.filter(game => {

    const matchesSearch =
      game.name.toLowerCase().includes(search);

    const matchesPlatform =
      platform === "all" ||
      game.platform === platform;

    const matchesRegion =
      region === "all" ||
      game.region === region;

    const matchesLanguage =
      language === "all" ||
      game.language === language;

    const matchesType =
      type === "all" ||
      game.type === type;

    return (
      matchesSearch &&
      matchesPlatform &&
      matchesRegion &&
      matchesLanguage &&
      matchesType
    );

  });


  const container =
    document.getElementById("games");

  const stats =
    document.getElementById("stats");


  stats.textContent =
    results.length +
    " item" +
    (results.length === 1 ? "" : "s") +
    " found";


  if (results.length === 0) {

    container.innerHTML =
      '<div class="empty">🍀 Nothing found.</div>';

    return;

  }


  const favorites = getFavorites();


  container.innerHTML = results.map((game) => {

    const index = games.indexOf(game);

    const isFavorite =
      favorites.includes(index);


    return `

      <div class="card">

        <h2>🍀 ${escapeHTML(game.name)}</h2>

        <span class="tag">
          ${escapeHTML(game.platform)}
        </span>

        <span class="tag">
          ${escapeHTML(game.region)}
        </span>

        <span class="tag">
          ${escapeHTML(game.language)}
        </span>

        <span class="tag">
          ${escapeHTML(game.type)}
        </span>

        <span class="tag">
          v${escapeHTML(game.version)}
        </span>

        <p>
          ${escapeHTML(game.description)}
        </p>

        <div class="card-buttons">

          <button onclick="details(${index})">
            ℹ️ Details
          </button>

          <button onclick="openSource(${index})">
            🌐 Source
          </button>

          ${
            game.download
            ?
            `<button onclick="downloadFile(${index})">
              ⬇️ Download
            </button>`
            :
            `<button disabled>
              ⬇️ Download not added
            </button>`
          }

          <button onclick="makeQR(${index})">
            📱 FBI QR
          </button>

          <button
            class="${isFavorite ? "favorite" : ""}"
            onclick="toggleFavorite(${index})"
          >
            ${isFavorite ? "⭐ Favorited" : "☆ Favorite"}
          </button>

        </div>

      </div>

    `;

  }).join("");

}


function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function details(index) {

  const game = games[index];

  document.getElementById("modalTitle").textContent =
    "🍀 " + game.name;

  document.getElementById("modalText").innerHTML = `

    <p>
      <strong>Platform:</strong>
      ${escapeHTML(game.platform)}
    </p>

    <p>
      <strong>Region:</strong>
      ${escapeHTML(game.region)}
    </p>

    <p>
      <strong>Language:</strong>
      ${escapeHTML(game.language)}
    </p>

    <p>
      <strong>File type:</strong>
      ${escapeHTML(game.type)}
    </p>

    <p>
      <strong>Version:</strong>
      ${escapeHTML(game.version)}
    </p>

    <p>
      ${escapeHTML(game.description)}
    </p>

  `;

  document.getElementById("qr").innerHTML = "";

  document.getElementById("modal").style.display =
    "flex";

}


function openSource(index) {

  const game = games[index];

  window.open(
    game.source,
    "_blank"
  );

}


function downloadFile(index) {

  const game = games[index];

  if (!game.download) {

    alert(
      "A direct authorized download file has not been added yet."
    );

    return;

  }

  window.open(
    game.download,
    "_blank"
  );

}


function makeQR(index) {

  const game = games[index];

  if (!game.download) {

    alert(
      "This item does not have a direct download URL yet. The QR cannot install it through FBI."
    );

    return;

  }


  document.getElementById("modalTitle").textContent =
    "📱 FBI QR — " + game.name;

  document.getElementById("modalText").innerHTML =
    "Scan this QR with FBI. The QR points to the direct authorized download file.";

  document.getElementById("qr").innerHTML =
    "Creating QR code...";

  document.getElementById("modal").style.display =
    "flex";


  const script =
    document.createElement("script");

  script.src =
    "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";

  script.onload = function() {

    document.getElementById("qr").innerHTML = "";

    new QRCode(
      document.getElementById("qr"),
      {
        text: game.download,
        width: 220,
        height: 220
      }
    );

  };

  script.onerror = function() {

    document.getElementById("qr").innerHTML =
      "QR library could not load. Check your internet connection.";

  };

  document.body.appendChild(script);

}


function closeModal() {

  document.getElementById("modal").style.display =
    "none";

}


function showAll() {

  document.getElementById("search").value = "";

  document.getElementById("platform").value = "all";

  document.getElementById("region").value = "all";

  document.getElementById("language").value = "all";

  document.getElementById("type").value = "all";

  showGames();

}


function showFavorites() {

  const favorites = getFavorites();

  const favoriteGames =
    games.filter(
      (game, index) =>
        favorites.includes(index)
    );

  showGames(favoriteGames);

}


function resetFilters() {

  showAll();

}


showGames();

</script>

</body>
</html>
